  return port ? sideShips(s, other).filter(sh => (sh.box === 'deployable' || sh.box === 'makeReady') && sh.port === port) : [];
}

PROCS.coastal = {
  start(s, f) {
    s.phase = 'coastal'; s.stepLabel = 'E Coastal Action Phase';
    f.L.order = [s.ai, s.human];   // A.I. side's missions first (E1-E3), then yours (E4-E6)
    f.L.si = 0;
    return G('side');
  },
  side(s, f) {
    const side = f.L.order[f.L.si];
    if (!side) return R();
    f.L.side = side;
    f.L.cut = Object.values(s.forces).filter(fr => fr.side === side && fr.mission === 'CuttingOut' && fr.ships.length).map(fr => fr.id);
    f.L.raids = Object.values(s.forces).filter(fr => fr.side === side && fr.mission === 'Raid' && fr.ships.length && RAID_ZONES[side].indexOf(fr.zone) >= 0).map(fr => fr.id);
    f.L.as = Object.values(s.forces).filter(fr => fr.side === side && fr.mission === 'ArmySupport' && fr.ships.length && fr.troops > 0).map(fr => fr.id);
    return G('cut');
  },
  /* E1/E4 Cutting-Out ----------------------------------------------------------------- */
  cut(s, f) {
    const fid = f.L.cut.shift();
    if (!fid) return G('raid');
    const fr = s.forces[fid], side = f.L.side, other = OTHER[side];
    if (!fr || !fr.ships.length) return G('cut');
    const port = homeportOfZone(s, other, fr.zone);
    const targets = cuttingOutTargets(s, side, fr.zone);
    let txt;
    if (fr.ended) txt = 'The Force has an Encounter Ended marker – the Cutting-Out mission aborts.';
    else if (!targets.length) txt = 'No enemy ships in the Deployable or Make Ready areas – the mission aborts.';
    else {
      const r = d10(s);
      const row = CUTTING_OUT.find(x => r >= x.lo && r <= x.hi);
      txt = `Cutting-Out Table: d10 ${r} → ${row.title} ${row.text}`;
      if (row.key === 'repulsed') s.coastal.cutouts.push({ side, result: 'repulsed' });
      if (row.key === 'success') {
        const tgt = targets.sort((a, b) => vpCapture(b) - vpCapture(a))[0];
        captureShip(s, tgt.id, side, 'Cutting-Out');
        tgt.box = 'lake'; tgt.zone = fr.zone; addShipToForce(s, tgt.id, fr.id);
        txt += ` ${def(tgt).name} is cut out and joins the ${SIDE_SHORT[side]} Force!`;
      }
    }
    log(s, `${SIDE_SHORT[side]} Cutting-Out in ${ZONE_NAME[fr.zone]}: ${txt}`, 'coastal');
    return P(info(`${SIDE_NAME[side]} Cutting-Out mission`, txt), 'cut');
  },
  /* E2/E5 Raids ----------------------------------------------------------------------------- */
  raid(s, f) {
    const fid = f.L.raids.shift();
    if (!fid) return G('as');
    const fr = s.forces[fid], side = f.L.side;
    if (!fr || !fr.ships.length) return G('raid');
    const ev = drawEvent(s, `${SIDE_SHORT[side]} Raid on ${ZONE_NAME[fr.zone]} coastline`, false);
    const lines = [`Coastal Event #${ev.id}: ${EVENT_TITLE[ev.coastal]}${ev.coastal !== 'none' ? ' – ' + EVENT_TEXT[ev.coastal]() : ''}`];
    const evs = [];
    if (['localMilitia', 'suppliesBurned', 'suppliesMoved', 'suddenStorm'].indexOf(ev.coastal) >= 0) evs.push(ev.coastal);
    if (ev.coastal === 'intelligence') grantIntelligence(s, side, ev.id, lines);
    const ok = fr.ships.length && forceShips(s, fr).some(isFull);
    if (ok) {
      s.coastal.raids.push({ side, zone: fr.zone, forceId: fid, guns: sumBy(forceShips(s, fr), guns), events: evs });
      lines.push(`The Raid marker is placed on the ${ZONE_NAME[fr.zone]} coastline (VPs and supplies in the Tally Phase).`);
    } else lines.push('The Force has no undamaged ship – no Raid.');
    lines.forEach(l => log(s, `${SIDE_SHORT[side]} Raid (${ZONE_NAME[fr.zone]}): ${l}`, 'coastal'));
    return P(info(`${SIDE_NAME[side]} Raid on ${ZONE_NAME[fr.zone]}`, lines.join('\n'), { eventCard: ev.id }), 'raid');
  },
  /* E3/E6 Army Support -------------------------------------------------------------------- */
  as(s, f) {
    const side = f.L.side, other = OTHER[side];
    // E3.1 Launch Troops from Forces with at least one undamaged ship in a legal zone
    const zonesLaunch = {};
    f.L.as.forEach(fid => {
      const fr = s.forces[fid];
      if (!fr || !fr.ships.length || !fr.troops) return;
      const legal = fr.zone === 'NIA' || homeportOfZone(s, other, fr.zone);
      if (!legal || !forceShips(s, fr).some(isFull)) return;
      zonesLaunch[fr.zone] = zonesLaunch[fr.zone] || [];
      zonesLaunch[fr.zone].push(fid);
    });
    f.L.lz = Object.keys(zonesLaunch).map(z => ({ z, forces: zonesLaunch[z] }));
    f.L.as = [];
    return G('asZone');
  },
  asZone(s, f) {
    const item = f.L.lz.shift();
    if (!item) { f.L.si++; return G('side'); }
    const side = f.L.side, other = OTHER[side];
    f.L.cur = item;
    let troops = 0;
    item.forces.forEach(fid => { const fr = s.forces[fid]; troops += fr.troops; fr.launched = fr.troops; fr.troops = 0; });
    f.L.troops = troops;
    log(s, `${SIDE_SHORT[side]} Troops launched in ${ZONE_NAME[item.z]}: ${troops}.`, 'coastal');
    const port = homeportOfZone(s, other, item.z);
    if (port) {
      const defenders = sideShips(s, other).filter(sh => (sh.box === 'deployable' || sh.box === 'transit') && sh.port === port);
      if (defenders.length) return C('harbor', { zone: item.z, att: side, forces: item.forces, port }, 'asBattle');
    }
    return G('asBattle');
  },
  asBattle(s, f) {
    const side = f.L.side, other = OTHER[side], item = f.L.cur;
    const ships = item.forces.reduce((a, fid) => a.concat(s.forces[fid] ? s.forces[fid].ships : []), []);
    const target = item.z === 'NIA' ? 'NIA' : 'HOME';
    const ev = drawEvent(s, `${SIDE_SHORT[side]} Land Battle (${ZONE_NAME[item.z]})`, false);
    const lines = [`Coastal Event #${ev.id}: ${EVENT_TITLE[ev.coastal]}${ev.coastal !== 'none' ? ' – ' + EVENT_TEXT[ev.coastal]() : ''}`];
    let shift = 0, storm = false;
    if (ev.coastal === 'moreDefenders') shift -= 2;
    if (ev.coastal === 'suddenStorm') storm = true;
    if (ev.coastal === 'intelligence') grantIntelligence(s, side, ev.id, lines);
    let support = ships.slice();
    if (ev.coastal === 'heatedShot' && support.length) {
      const id = pick(s, support); s.ships[id].flags.heatedShot = true;
      lines.push(`Heated Shot: ${shipName(s, id)} is Damaged – no Long Guns in this battle; to In Ordinary in F7.`);
    }
    if (ev.coastal === 'explosion' && support.length) {
      const id = pick(s, support);
      lines.push(`Explosion! ${shipName(s, id)} blows up${s.flagship[side] === id ? ' – the Leader is killed' : ''}.`);
      sinkShip(s, id, other, 'Explosion', 'killed');
    }
    if (ev.coastal === 'requisition' && support.length) {
      const alive = support.filter(id => s.ships[id].box === 'lake');
      if (alive.length) {
        const minG = Math.min(...alive.map(id => guns(s.ships[id])));
        const id = pick(s, alive.filter(x => guns(s.ships[x]) === minG));
        s.ships[id].flags.requisition = true;
        lines.push(`Requisition: ${shipName(s, id)} is taken by the Army – out of play next turn.`);
      }
    }
    const sup = ships.map(id => s.ships[id]).filter(sh => sh.box === 'lake' && isFull(sh) && !sh.flags.heatedShot);
    const lgTot = sumBy(sup, lg);
    const r = d66(s);
    f.L.lb = { side, zone: item.z, target, troops: f.L.troops, lg: lgTot, shift, storm, roll: r.v, ev: ev.id };
    lines.push(`Land Battle vs ${target === 'NIA' ? 'the Niagara Front' : (other === 'US' ? HOMEPORT_NAME.US : HOMEPORT_NAME.BR)}: ${f.L.troops} Troops marker(s), supporting Long Gun Strength ${lgTot}${shift ? `, column shift ${shift}` : ''}. Dice (red/blue) 11-66: ${r.v}.`);
    lines.forEach(l => log(s, l, 'coastal'));
    f.L.lbLines = lines;
    if (!s.options.manualLandBattle) {
      const lk = lbLookup(lgTot, f.L.troops, shift, r.v);
      const lkTxt = `Land Battle Table: column “${lk.colLabel}”${lk.band !== lk.band0 ? ` (shifted from ${LB_BANDS[lk.band0]})` : ''}${f.L.troops > 3 ? ' (3 Troops is the highest column)' : ''}, roll ${r.v}.`;
      f.L.lbLines.push(lkTxt); log(s, lkTxt, 'roll');
      f.answer = lk.result;
      return G('asResult');
    }
    return P(choice(`Land Battle – read Player Aid VII`, lines.join('\n') + `\n\nOn the Land Battle Table (Player Aid VII) use the column for ${lgTot} Long Gun Strength with ${f.L.troops} Troops marker(s)${shift ? `, shifted ${shift} column(s) left` : ''}, row ${r.v}. Select the result:`,
      LB_RESULTS.map(x => ({ id: x.id, label: x.label })), { landBattle: f.L.lb }), 'asResult');
  },
  asResult(s, f) {
    const lb = f.L.lb;
    let res = f.answer;
    if (lb.storm && res === 'AM') { res = 'AS'; log(s, 'Sudden Storm: Attacker Major Success reduced to Success.', 'event'); }
    lb.result = res;
    s.coastal.battles.push(lb);
    const lbl = LB_RESULTS.find(x => x.id === res).label;
    log(s, `${SIDE_SHORT[lb.side]} Land Battle result: ${lbl}.`, 'coastal');
    return P(info('Land Battle result', `${f.L.lbLines.join('\n')}\nResult: ${lbl}${lb.storm && f.answer === 'AM' ? ' (Sudden Storm)' : ''}. Effects apply in the Tally & Reset Phase.`), 'asZone');
  },
};

function grantIntelligence(s, side, cardId, lines) {
  s.intelligence[side] = { card: cardId, until: s.turn + 1 };
  s.deck.event = s.deck.event.filter(x => x !== cardId);
  lines.push(`Intelligence: the ${SIDE_PL[side]} get +1 DRM on Reaction Checks (and no negative DRMs) in the next Encounter involving the enemy Flagship (until the end of next turn).`);
}

/* Harbor Encounter (12): up to two Gunnery Rounds, no Weather Gage / Tactics,
   −1 column shift, no Disengagement or Withdrawal. */
PROCS.harbor = {
  start(s, f) {
    const A = f.A, att = A.att, dfs = OTHER[att];
    s.encounter = { zone: A.zone, kind: 'harbor', segment: 'patrol', ships: {}, side: {}, struckBy: {}, withdrawn: { US: false, BR: false }, harborDefender: dfs, wgCard: null, leaderFate: {} };
    const attShips = A.forces.reduce((a, fid) => a.concat(s.forces[fid] ? s.forces[fid].ships : []), []);
    const defShips = sideShips(s, dfs).filter(sh => (sh.box === 'deployable' || sh.box === 'transit') && sh.port === A.port).map(sh => sh.id);
    attShips.forEach(id => encAdd(s, id)); defShips.forEach(id => encAdd(s, id));
    s.combat = { att, def: dfs, seq: att === 'US' ? 'A' : 'B', pos: 0, col: { US: [], BR: [] }, tows: {}, tac: { att: null, def: null }, gr: 0 };
    let atts = attShips.filter(id => isFull(s.ships[id]));
    if (att === 'BR' && s.ai === 'BR') atts = atts.filter(id => !isCLS(s.ships[id]));
    let defs = defShips.slice();
    if (dfs === 'BR' && s.ai === 'BR') defs = defs.filter(id => !isCLS(s.ships[id]));
    s.combat.col[att] = buildColumn(s, atts, {}, att);
    s.combat.col[dfs] = buildColumn(s, defs, {}, dfs);
    f.L.round = 0;
    const txt = `HARBOR ENCOUNTER at ${A.port === 'home' ? HOMEPORT_NAME[dfs] : TEMP_HOMEPORT_NAME[dfs]}: ${s.combat.col[att].map(id => shipName(s, id)).join(', ')} must fight the ships in port: ${s.combat.col[dfs].map(id => shipName(s, id)).join(', ')}. (Up to two Gunnery Rounds, −1 column for shore batteries, no Disengagement or Withdrawal.)`;
    log(s, txt, 'combat');
    s.stepLabel = 'E Harbor Encounter';
    return P(info('Harbor Encounter', txt, { combatView: true }), 'round');
  },
  round(s, f) {
    const c = s.combat, e = s.encounter;
    tidyColumns(s);
    const atts = colShips(c, c.att).filter(id => isFull(s.ships[id]));
    const defs = colShips(c, c.def);
    if (f.L.round >= 2 || !atts.length || !defs.length) return G('end');
    f.L.round++;
    const aStr = sideStrength(s, atts, c.att, false), dStr = sideStrength(s, defs, c.att, false);
    const ratio = dStr <= 0 ? 99 : aStr / dStr;
    let col = Math.max(0, crtColumnForRatio(ratio) - 1);
    let drm = 0; const drms = [];
    if (atts.indexOf(s.flagship[c.att]) >= 0 && commandDRMAvailable(s, c.att)) { drm++; drms.push('+1 Command'); }
    const r = d10(s), m = Math.max(0, Math.min(9, r + drm));
    const code = CRT[m][col];
    const res = parseCrt(code);
    const lines = [`Harbor Gunnery Round ${f.L.round}: ${SIDE_SHORT[c.att]} ${fmt(aStr)} vs ${fmt(dStr)} = ${fmt(ratio)}:1, −1 shore batteries → ${CRT_COLS[col]}; d10 ${r}${drm ? '+' + drm : ''} → ${code}${drms.length ? ' [' + drms.join(', ') + ']' : ''}. (W results ignored.)`];
    const dMap = {}, aMap = {};
    if (res.dHits) distributeHits(s, c.col[c.def], res.dHits, dMap, lines, { side: c.def });
    if (res.aHits) distributeHits(s, c.col[c.att], res.aHits, aMap, lines, { side: c.att });
    applyHits(s, c.def, dMap, { round: 'GR' }, lines);
    applyHits(s, c.att, aMap, { round: 'GR' }, lines);
    lines.forEach(l => log(s, l, 'combat'));
    if (res.end) { lines.push('END – the Harbor Encounter ends.'); f.L.round = 2; }
    return P(info('Harbor Encounter', lines.join('\n'), { combatView: true }), 'round');
  },
  end(s, f) {
    const e = s.encounter, c = s.combat;
    const lines = [];
    Object.keys(e.ships).forEach(id => {
      const st = e.ships[id], sh = s.ships[id];
      if (st === 'struck') { captureShip(s, id, e.harborDefender, 'Struck Colors in a Harbor Encounter', false, (e.leaderFate || {})[id]); lines.push(`${def(sh).name} strikes and is captured by the defenders.`); }
      if (st === 'hstruck') { lines.push(`${shipName(s, id)} struck her colors in her own harbor – not captured.`); }
      if (sh && sh.owner === e.harborDefender && sh.box === 'deployable' && isReduced(sh)) sh.box = 'transit';
    });
    endEncounterEffects(s);
    s.encounter = null; s.combat = null;
    lines.forEach(l => log(s, l, 'combat'));
    return lines.length ? P(info('Harbor Encounter ends', lines.join('\n')), '__done') : R();
  },
  __done(s, f) { return R(); },
};

;
/* ---- engine_tally.js ---- */
/* ============================================================================
   F Tally and Reset Phase
   ========================================================================== */
PROCS.tally = {
  start(s, f) {
    s.phase = 'tally'; s.stepLabel = 'F Tally and Reset';
    const lines = [];
    const say = (t) => { lines.push(t); };
    const vp0 = { US: s.vp.US, BR: s.vp.BR };
    /* F1 Destroyed / Captured ships */
    s.lossesThisTurn.forEach(L => {
      if (!L.by) return;
      const d = SHIP_BY_ID[defId(s.ships[L.id])];
      const n = L.how === 'sunk' ? d.vp[0] : d.vp[1];
      addVP(s, L.by, n, `${d.name} ${L.how === 'sunk' ? 'destroyed' : 'captured'} (${L.why})`);
      say(`F1: ${d.name} ${L.how === 'sunk' ? 'destroyed' : 'captured'} – ${vpTxt(L.by, n)}.`);
    });
    s.coastal.cutouts.filter(x => x.result === 'repulsed').forEach(x => { addVP(s, OTHER[x.side], 1, 'Cutting-Out party repulsed'); say(`F1: Cutting-Out repulsed – ${vpTxt(OTHER[x.side], 1)}.`); });
    /* F2 Lake Zone Control */
    ZONES.forEach(z => {
      const fullUS = shipsInZone(s, z, 'US').filter(isFull), fullBR = shipsInZone(s, z, 'BR').filter(isFull);
      if (fullUS.length && fullBR.length) { if (s.zones[z].control) say(`F2.1: ${ZONE_NAME[z]} becomes Contested.`); s.zones[z].control = null; }
      ['US', 'BR'].forEach(side => {
        const mine = side === 'US' ? fullUS : fullBR, theirs = side === 'US' ? fullBR : fullUS;
        if (sumBy(mine, sh => sh.steps) >= 5 && !theirs.length) { if (s.zones[z].control !== side) say(`F2.2: ${SIDE_NAME[side]} control of ${ZONE_NAME[z]}.`); s.zones[z].control = side; }
      });
    });
    // F2.3 invalid Blockade markers
    ZONES.forEach(z => {
      const b = s.zones[z].blockade; if (!b) return;
      if (!blockadeConditions(s, b, z)) { s.zones[z].blockade = null; say(`F2.3: the ${SIDE_NAME[b]} Blockade of ${ZONE_NAME[z]} is not maintained – removed.`); }
    });
    // F2.4 a Blockaded side loses all its Lake Control markers
    ['US', 'BR'].forEach(side => {
      const bz = [homeZone(side), TEMP_HOMEPORT_ZONE[side]].filter(z => s.zones[z].blockade === OTHER[side]);
      if (bz.length) ZONES.forEach(z => { if (s.zones[z].control === side) { s.zones[z].control = null; say(`F2.4: Blockaded ${SIDE_PL[side]} lose control of ${ZONE_NAME[z]}.`); } });
    });
    // F2.5 Lake Control VPs
    ['US', 'BR'].forEach(side => {
      const n = ZONES.filter(z => s.zones[z].control === side).length;
      if (n) { addVP(s, side, n, `Lake Control (${n} zone${n > 1 ? 's' : ''})`); say(`F2.5: ${SIDE_NAME[side]} Lake Control ${n} zone(s): ${vpTxt(side, n)}.`); }
    });
    /* F3 Land Battle effects */
    s.coastal.battles.forEach(b => {
      const other = OTHER[b.side];
      if (b.target === 'HOME' && (b.result === 'AM' || b.result === 'AF')) {
        const r = twoD6(s), t = r + (b.result === 'AF' ? 2 : 0);
        const row = SHIPYARD.find(x => t >= x.lo && t <= x.hi);
        say(`F3.1: Shipyard Damage vs ${SIDE_PL[other]} – 2d6 ${r}${b.result === 'AF' ? '+2' : ''} = ${t}: ${row.title}.`);
        changeCD(s, other, row.cd, 'Shipyard Damage');
        applyShipyard(s, other, b.side, row.eff, say);
      }
      if (b.target === 'NIA') {
        const val = LB_RESULTS.find(x => x.id === b.result).att;
        const dir = b.side === 'BR' ? 1 : -1;
        const before = s.niagara;
        s.niagara = Math.max(0, Math.min(6, s.niagara + dir * val));
        if (before !== s.niagara) say(`F3.2: Niagara Front ${NIAGARA_SPACES[before]} → ${NIAGARA_SPACES[s.niagara]}.`);
      }
    });
    if (s.turn === 7) {
      if (s.niagara === 6 && s.zones.NIA.control === 'BR' && !isBlockaded(s, 'BR')) { addVP(s, 'BR', 10, 'Army Victory on the Niagara Front'); say('F3.2.1: British Army Victory on the Niagara Front – −10 VP (British).'); }
      if (s.niagara === 0 && s.zones.NIA.control !== 'BR') { addVP(s, 'US', 10, 'Army Victory on the Niagara Front'); say('F3.2.1: American Army Victory on the Niagara Front – U.S. +10 VP.'); }
    }
    const h = s.human;
    if (s.troops[h].available > 0) { addVP(s, h, -s.troops[h].available, `${s.troops[h].available} untransported Troops marker(s)`); say(`F3.3: ${s.troops[h].available} untransported Troops marker(s) – you lose ${s.troops[h].available} VP (Game Score ${h === 'US' ? '−' : '+'}${s.troops[h].available}).`); }
    /* F4 Raid VPs */
    s.coastal.raids.forEach(r => {
      r.supplyOK = true;
      let vp = RAID_VP[r.zone];
      if (r.events.indexOf('localMilitia') >= 0) {
        const d = d6(s);
        if (d > r.guns) { vp = 0; r.supplyOK = false; say(`F4: Local Militia – 1d6 ${d} > ${r.guns} guns: the Raid on ${ZONE_NAME[r.zone]} scores nothing.`); }
        else say(`F4: Local Militia – 1d6 ${d} ≤ ${r.guns} guns: the raiders get through.`);
      }
      if (r.events.indexOf('suppliesMoved') >= 0) { vp = 0; r.supplyOK = false; }
      if (r.events.indexOf('suddenStorm') >= 0) { vp = RAID_VP[r.zone] === 2 ? 1 : 0; r.supplyOK = false; }
      if (vp) { addVP(s, r.side, vp, `Raid on the ${ZONE_NAME[r.zone]} coastline`); say(`F4: ${SIDE_SHORT[r.side]} Raid on ${ZONE_NAME[r.zone]} – ${vpTxt(r.side, vp)}.`); }
      else say(`F4: ${SIDE_SHORT[r.side]} Raid on ${ZONE_NAME[r.zone]} scores no VPs.`);
    });
    /* F5 Convoy Supply */
    [s.ai, s.human].forEach(side => convoySupply(s, side, say));
    // F5.3 other adjustments
    s.coastal.battles.forEach(b => {
      if (b.target === 'HOME' && ['AS', 'AM', 'AF'].indexOf(b.result) >= 0) { moveSupply(s, OTHER[b.side], -2, 'enemy Land Battle success vs Homeport'); say(`F5.3: Land Battle success vs the ${SIDE_NAME[OTHER[b.side]]} Homeport – their Convoy Supply −2.`); }
    });
    s.coastal.raids.forEach(r => {
      if (!r.supplyOK) return;
      const d = d6(s), need = r.events.indexOf('suppliesBurned') >= 0 ? 6 : 5;
      if (d >= need) { moveSupply(s, r.side, 1, 'Raid supplies'); moveSupply(s, OTHER[r.side], -1, 'Raid losses'); say(`F5.3: Raid on ${ZONE_NAME[r.zone]} – 1d6 ${d}: supplies seized (${SIDE_SHORT[r.side]} +1, ${SIDE_SHORT[OTHER[r.side]]} −1).`); }
      else say(`F5.3: Raid on ${ZONE_NAME[r.zone]} – 1d6 ${d}: no supplies seized.`);
    });
    // 5.4 Fall Offensive Supplied
    if (!s.fallOffensive) {
      const us = s.supply.US >= SUPPLY_MAX, br = s.supply.BR >= SUPPLY_MAX;
      if (us && br) { s.fallOffensive = 'both'; say('5.4: both sides reach Fall Offensive Supplied together – no VPs.'); }
      else if (us || br) { const side = us ? 'US' : 'BR'; s.fallOffensive = side; addVP(s, side, 5, 'Fall Offensive Supplied first'); say(`5.4: ${SIDE_NAME[side]} Fall Offensive Supplied first – ${vpTxt(side, 5)}.`); }
    }
    /* F6 Blockade checks */
    ['US', 'BR'].forEach(bl => {
      const vic = OTHER[bl];

/* Force Package helper (British campaign): totals + auto-fill + per-package memory */
const PKG_KEY = 'agc_pkg_memory_v1';
function pkgMemory() { try { return JSON.parse(localStorage.getItem(PKG_KEY) || '{}'); } catch (e) { return {}; } }
function savePkgMemory(m) { try { localStorage.setItem(PKG_KEY, JSON.stringify(m)); } catch (e) { } }
function pkgAutoFill(s, pool, rule) {
  const ships = pool.map(id => s.ships[id]);
  const rnd = a => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(x => x[1]);
  const mains = rnd(ships.filter(isMain)), secs = rnd(ships.filter(sh => !isMain(sh)));
  const out = [];
  if (rule.type === 'ships') {
    mains.concat(secs).slice(0, rule.n).forEach(sh => out.push(sh.id));
    return out.length === rule.n ? out : [];
  }
  const key = rule.type === 'lg' ? lg : rule.type === 'ca' ? ca : car;
  // Main Ships first (largest value first = fewest ships), then Secondary Ships drawn at random [5.3.1]
  let tot = 0;
  mains.sort((a, b) => key(b) - key(a)).forEach(sh => { if (tot < rule.n && key(sh) > 0) { out.push(sh.id); tot += key(sh); } });
  secs.forEach(sh => { if (tot < rule.n && key(sh) > 0) { out.push(sh.id); tot += key(sh); } });
  return tot >= rule.n ? out : [];
}

  const mem = pkgMemory();

  const tSel = el('select', null, ...[['lg', 'Long Gun ≥'], ['ca', 'Close Action ≥'], ['car', 'Carronade ≥'], ['ships', 'Number of ships =']].map(([v, l]) => el('option', { value: v, selected: rule.type === v ? true : null }, l)));
  const nIn = el('input', { type: 'number', min: 0, value: rule.n || '', style: { width: '60px' } });
  const remember = el('input', { type: 'checkbox', checked: true });
  const apply = () => {

    const r = { type: tSel.value, n: +nIn.value || 0 };

  box.appendChild(el('div', { style: { marginTop: '4px' } }, `Auto-fill Package #${pr.pkg}: `, tSel, ' ', nIn, ' ', el('button', { class: 'small', onclick: apply }, 'Auto-fill'), ' ', el('label', { style: { display: 'inline' } }, remember, ' remember for this package')));

  Object.keys(FORCE_PACKAGE_TEXT).forEach(k => fpt.appendChild(el('tr', null, el('th', null, k), el('td', { style: { textAlign: 'left' } }, FORCE_PACKAGE_TEXT[k]))));
  r.appendChild(fpt);
  r.appendChild(el('p', null, FORCE_PACKAGE_FOOTNOTE + ' Selection [5.3.1]: Main Ships first, then Secondary; the smallest number of ships; ties by random draw.'));
  r.appendChild(el('h2', null, 'Checks'));
  r.appendChild(el('ul', null,
    el('li', null, 'Disengagement: 1d6 1–3 Disengages (−1 per friendly ship already Struck). Fast ships pass their first check automatically.'),
    el('li', null, 'Strike Check: 1d10 1–2 Fight On, 3–8 Strike Colors, 9–10 Sinks (−1 Flagship with original Leader; +1 per hit on a zero-step ship).'),
    el('li', null, 'Leader Casualty: 2d6 10 Wounded, 11–12 Killed (+1 hit in Close Action, +1 win Melee, +2 lose Melee).'),
    el('li', null, 'Close Action: 2:1 CA or better; 1d10 ≤ difference = step loss (then Disengagement/Strike Check – a defender still Engaged goes to Melee), otherwise Melee (d6 + CA each; 150% captures).'),
    el('li', null, 'Reaction Check: 1d10 5–9 succeeds; +1 same zone, −1 per zone of distance (Homeport to its zone = 1). A.I. Homeport pool: no modifiers.'),
    el('li', null, 'Struck ships at Encounter end: Captured if their side withdrew/was eliminated, rescued if the enemy did, otherwise 1d6 1–3 Captured.')));
  r.appendChild(el('h2', null, 'Ships'));
  const t3 = el('table', null, el('tr', null, ...['Ship', 'Type', 'Guns', 'Full LG/Car/CA/Def/Steps', 'Reduced', 'VP D/C', 'Notes'].map(h => el('th', null, h))));
  SHIP_DEFS.forEach(d => t3.appendChild(el('tr', null, el('td', { class: d.side === 'US' ? 'us' : 'br' }, d.name + (d.ver ? ' (' + d.ver + ')' : '')), el('td', null, d.type), el('td', null, String(d.guns)), el('td', null, d.full.join('/')), el('td', null, d.red.join('/')), el('td', null, d.vp.join('/')), el('td', null, [d.main ? 'Main' : 'Secondary', d.T ? 'T' : '', d.F ? 'F' : ''].filter(Boolean).join(' ')))));
  r.appendChild(t3);
  r.appendChild(el('h2', null, 'Victory'));
  r.appendChild(el('p', null, '−33 or less British Decisive · −22 to −32 British Victory · −11 to −21 British Marginal · −10 to +10 Draw · +11 to +21 U.S. Marginal · +22 to +32 U.S. Victory · +33 or more U.S. Decisive. Construction Delay left at the end is deducted from each side.'));
  openModal(r);
}
function openSettings() {
  const s = G_STATE; if (!s) return;
  const box = el('div');
  box.appendChild(el('h2', null, 'Settings'));
  const cb = el('input', { type: 'checkbox', checked: s.options.confirmAiSteps ? true : null });
  cb.onchange = () => { s.options.confirmAiSteps = cb.checked; autosave(); };
  box.appendChild(el('label', null, cb, ' Pause after each A.I. move'));
  const tog = (k, label) => { const c = el('input', { type: 'checkbox', checked: s.options[k] ? true : null }); c.onchange = () => { s.options[k] = c.checked; autosave(); }; return el('label', null, c, ' ', label); };
  box.appendChild(tog('manualPackages', 'Pick American Force Package ships myself (British campaign)'));
  box.appendChild(tog('manualLandBattle', 'Read the Land Battle Table myself'));
  box.appendChild(el('p', { class: 'muted' }, `Seed ${s.seed} · Cutting-Out ${s.options.cuttingOut ? 'on' : 'off'} · OA1 ${s.options.oa1Upgrades ? 'on' : 'off'} · U.S. A.I. precondition: ${s.options.usAiPrecondition}. App version ${APP_VERSION}.`));
  openModal(box);
}
function openAdjust() {
  const s = G_STATE; if (!s) return;
  const box = el('div');
  box.appendChild(el('h2', null, 'Adjust (manual corrections)'));
  box.appendChild(el('p', { class: 'muted' }, 'Use this to match the app to your table if something went differently. Every change is logged and can be undone.'));
  const num = (label, get, set) => {
    const inp = el('input', { type: 'number', step: 1, value: get(), style: { width: '70px' } });
    return el('label', null, label + ' ', inp, ' ', el('button', { class: 'small', onclick: () => {
      const v = Number(inp.value);
      if (inp.value === '' || !Number.isInteger(v)) { inp.value = get(); return; }   // whole numbers only
      UNDO.push(JSON.stringify(s)); set(v); log(s, `Manual adjustment: ${label} = ${v}`, 'player'); autosave(); render(); openAdjust(); } }, 'Set'));
  };
  box.appendChild(num('U.S. VP', () => s.vp.US, v => { s.vp.US = v; }));
  box.appendChild(num('British VP', () => s.vp.BR, v => { s.vp.BR = v; }));
  box.appendChild(num('U.S. Convoy Supply', () => s.supply.US, v => { s.supply.US = clampSupply(v); }));
  box.appendChild(num('British Convoy Supply', () => s.supply.BR, v => { s.supply.BR = clampSupply(v); }));
  box.appendChild(num('U.S. Construction Delay', () => s.cd.US, v => { s.cd.US = Math.max(0, v); }));
  box.appendChild(num('British Construction Delay', () => s.cd.BR, v => { s.cd.BR = Math.max(0, v); }));
  box.appendChild(num('Niagara Front (0 Burlington … 6 Fort George)', () => s.niagara, v => { s.niagara = Math.max(0, Math.min(6, v)); }));
  box.appendChild(num('Your Available Troops', () => s.troops[s.human].available, v => { s.troops[s.human].available = Math.max(0, v); }));
  box.appendChild(el('h3', null, 'Ships'));
  const sel = el('select', null); Object.keys(s.ships).forEach(id => sel.appendChild(el('option', { value: id }, `${shipName(s, id)} – ${BOX_NAME[s.ships[id].box]}`)));
  const boxSel = el('select', null); ['deployable', 'makeReady', 'repairing', 'construction', 'ordinary', 'transit', 'sunk', 'outOfPlay'].forEach(b => boxSel.appendChild(el('option', { value: b }, BOX_NAME[b])));
  const stepIn = el('input', { type: 'number', min: 0, max: 3, style: { width: '50px' } });
  const ownSel = el('select', null, el('option', { value: 'US' }, 'U.S.'), el('option', { value: 'BR' }, 'British'));
  const sync = () => { const sh = s.ships[sel.value]; boxSel.value = sh.box === 'lake' ? 'deployable' : sh.box; stepIn.value = sh.steps; ownSel.value = sh.owner; };
  sel.onchange = sync; sync();
  box.appendChild(el('div', null, sel, ' box ', boxSel, ' steps ', stepIn, ' owner ', ownSel, ' ', el('button', { class: 'small', onclick: () => {
    UNDO.push(JSON.stringify(s));
    const sh = s.ships[sel.value];
    if (sh.forceId) removeShipFromForce(s, sh.id);
    sh.box = boxSel.value; sh.zone = null; sh.owner = ownSel.value; sh.steps = Math.max(0, Math.min(def(sh).full[4], +stepIn.value));
    log(s, `Manual adjustment: ${shipName(s, sh.id)} → ${BOX_NAME[sh.box]}, ${sh.steps} steps, ${SIDE_SHORT[sh.owner]}.`, 'player');
    autosave(); render(); openAdjust();
  } }, 'Apply')));
  box.appendChild(el('p', { class: 'muted' }, 'Ship changes take effect from the next step; a ship moved off the lake leaves its Force.'));
  openModal(box);
}

/* ---------- main render ---------- */
function render() {
  const s = G_STATE;
  renderHeader(s);
  if (!s) { renderSetup(); return; }
  const app = $('app');
  if (!$('proc')) { app.innerHTML = ''; app.appendChild(el('div', { id: 'proc', class: 'panel' })); app.appendChild(el('div', { id: 'board' })); }
  renderProc(s);
  renderBoard(s);
}

;
/* ---- main.js ---- */
/* Boot */
installResume();
document.addEventListener('keydown', (e) => {
  if (!G_STATE || !G_STATE.prompt) return;
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA')) return;
  if ((e.key === 'Enter' || e.key === ' ') && G_STATE.prompt.kind === 'info') { e.preventDefault(); doAct('ok'); }
  if ((e.key === 'z' || e.key === 'Z') && (e.ctrlKey || e.metaKey)) { e.preventDefault(); undo(); }
});
window.addEventListener('load', () => { G_STATE = null; render(); });

</script>
