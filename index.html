<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Glorious Chance – Solo Companion v0.2.4</title>
<style>
:root {
  --bg: #f3efe6; --panel: #fffdf8; --ink: #1f2a33; --muted: #6b7680; --line: #d9d1c2;
  --us: #2f5f9e; --us-soft: #dbe7f6; --br: #a8322d; --br-soft: #f6dddb; --gold: #b58a2b;
  --water: #cfe3ee; --water2: #b9d6e6; --ok: #2e7d4f; --warn: #b26b00; --bad: #a8322d;
  --radius: 8px; --shadow: 0 1px 3px rgba(0,0,0,.12);
  font-size: 15px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif; }
button, select, input { font-family: inherit; font-size: .95rem; }
button { cursor: pointer; border: 1px solid #9aa4ad; background: #fff; color: var(--ink); border-radius: 6px; padding: 6px 12px; }
button:hover { background: #f1f4f6; }
button.primary { background: #234a73; border-color: #234a73; color: #fff; }
button.primary:hover { background: #1b3a5b; }
button:disabled { opacity: .45; cursor: not-allowed; }
button.small { padding: 3px 8px; font-size: .82rem; }
.muted { color: var(--muted); }
.us { color: var(--us); } .br { color: var(--br); }

/* Header */
#hdr { position: sticky; top: 0; z-index: 20; background: #1f2f3e; color: #f4efe2; padding: 6px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
#hdr h1 { font-size: 1.05rem; margin: 0; letter-spacing: .5px; font-variant: small-caps; white-space: nowrap; }
#hdr .stat { display: flex; flex-direction: column; line-height: 1.15; font-size: .8rem; }
#hdr .stat b { font-size: 1rem; }
#hdr .btns { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
#hdr .btns button { background: #2f4458; color: #f4efe2; border-color: #4b6176; padding: 4px 10px; font-size: .85rem; }
#hdr .btns button:hover { background: #3b566f; }
.turntrack { display: flex; gap: 2px; }
.turntrack span { font-size: .68rem; padding: 2px 4px; border-radius: 3px; background: #2f4458; color: #b8c4cf; }
.turntrack span.cur { background: var(--gold); color: #1f2a33; font-weight: bold; }
.turntrack span.past { opacity: .5; }

/* Layout */
#app { display: grid; grid-template-columns: minmax(380px, 520px) 1fr; gap: 12px; padding: 12px; align-items: start; }
@media (max-width: 1000px) { #app { grid-template-columns: 1fr; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px; }
.panel h2 { margin: 0 0 6px; font-size: 1.05rem; font-variant: small-caps; letter-spacing: .3px; }
.panel h3 { margin: 10px 0 4px; font-size: .95rem; }
#proc { position: sticky; top: 64px; max-height: calc(100vh - 80px); overflow: auto; }
#proc .step { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
#proc .ptitle { font-size: 1.15rem; margin: 2px 0 8px; font-weight: bold; }
#proc .ptext { white-space: pre-wrap; line-height: 1.4; margin-bottom: 10px; }
#proc .opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
#proc .err { color: var(--bad); font-size: .88rem; margin-top: 6px; min-height: 1.2em; }
.optcard { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 6px 0; cursor: pointer; background: #fff; }
.optcard:hover { border-color: #234a73; background: #f4f8fc; }
.optcard .t { font-weight: bold; }
.optcard .d { font-size: .85rem; color: #3d4852; margin-top: 2px; }
.tac-white { border-left: 8px solid #e4e4e4; } .tac-lavender { border-left: 8px solid #b9a6c9; } .tac-salmon { border-left: 8px solid #d7a395; }
.tac-yellow { border-left: 8px solid #e9e33a; } .tac-teal { border-left: 8px solid #8fbfc1; } .tac-green { border-left: 8px solid #8aaa86; }

/* Lake */
#lake { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: auto auto; gap: 6px; background: linear-gradient(160deg, var(--water), var(--water2)); padding: 8px; border-radius: 10px; }
.zone { background: rgba(255,255,255,.55); border: 1px solid rgba(40,80,110,.35); border-radius: 8px; padding: 6px; min-height: 120px; position: relative; }
.zone.ctl-US { box-shadow: inset 0 0 0 3px var(--us); }
.zone.ctl-BR { box-shadow: inset 0 0 0 3px var(--br); }
.zone.enc { outline: 3px dashed var(--gold); }
.zone .zh { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: .9rem; margin-bottom: 4px; }
.zone .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 4px; }
.tag { font-size: .7rem; padding: 1px 6px; border-radius: 10px; background: #eee; border: 1px solid #ccc; white-space: nowrap; }
.tag.us { background: var(--us-soft); border-color: var(--us); color: var(--us); }
.tag.br { background: var(--br-soft); border-color: var(--br); color: var(--br); }
.tag.ev { background: #fff6dc; border-color: #d9b34a; color: #7a5a00; }
.tag.pe { background: #fff; border-color: #333; color: #333; }
.tag.blk { background: #333; color: #fff; border-color: #000; }
.force { border: 1px solid rgba(0,0,0,.15); border-radius: 6px; padding: 3px; margin-top: 4px; background: rgba(255,255,255,.7); }
.force .fh { font-size: .72rem; font-weight: bold; margin-bottom: 2px; }
.force.US .fh { color: var(--us); } .force.BR .fh { color: var(--br); }

/* Ships */
.ships { display: flex; flex-wrap: wrap; gap: 3px; }
.ship { display: inline-flex; flex-direction: column; min-width: 92px; max-width: 132px; border-radius: 5px; padding: 2px 5px; font-size: .72rem; line-height: 1.15; border: 1px solid; background: #fff; }
.ship.US { border-color: var(--us); background: #eef4fb; }
.ship.BR { border-color: var(--br); background: #fbefee; }
.ship.red { background: repeating-linear-gradient(45deg, #fff, #fff 4px, #f1f1f1 4px, #f1f1f1 8px); border-style: dashed; }
.ship .nm { font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ship .st { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .68rem; color: #333; }
.ship .fl { color: var(--gold); }
.ship.flag { box-shadow: 0 0 0 2px var(--gold); }
.ship.sel { box-shadow: 0 0 0 3px #234a73; }
.dots { letter-spacing: 1px; }

/* Homeports */
.ports { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
@media (max-width: 1300px) { .ports { grid-template-columns: 1fr; } }
.port { border-radius: 8px; padding: 6px; }
.port.US { background: #e9f0f8; border: 1px solid #b7c9de; }
.port.BR { background: #f8eceb; border: 1px solid #e0bdb9; }
.port h3 { margin: 0 0 4px; font-size: .9rem; }
.box { margin: 3px 0; }
.box .bl { font-size: .7rem; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }

/* Tracks */
.tracks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; font-size: .85rem; margin-top: 8px; }
.trk { display: flex; gap: 2px; align-items: center; }
.trk i { display: inline-block; width: 15px; height: 15px; font-size: .62rem; text-align: center; line-height: 15px; border: 1px solid #c9c0ae; background: #fff; font-style: normal; color: #999; }
.trk i.on.US { background: var(--us); color: #fff; border-color: var(--us); }
.trk i.on.BR { background: var(--br); color: #fff; border-color: var(--br); }
.trk i.tr { border-color: #6a8f3c; }
.niag { display: flex; gap: 2px; }
.niag span { font-size: .62rem; padding: 2px 3px; border: 1px solid #ccc; background: #fff; border-radius: 3px; }
.niag span.on { background: var(--gold); color: #fff; border-color: var(--gold); }

/* Cards */
.cardrow { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.tcard { width: 86px; min-height: 52px; border-radius: 6px; border: 1px solid #b9b9b9; font-size: .68rem; padding: 3px; background: #f7f7f7; }
.tcard.back { background: linear-gradient(135deg, #e0e9ef, #c7d8e3); }
.tcard.rev { background: #fff; }
.tcard.removed { opacity: .35; }
.tcard .z { font-weight: bold; }
.evcard { border: 1px solid #c9b78f; border-radius: 8px; background: #fffaf0; padding: 6px 8px; margin: 6px 0; font-size: .85rem; }
.evcard .top { display: flex; justify-content: space-between; font-weight: bold; }
.evcard .mid { margin: 4px 0; padding: 3px 6px; background: #eee; border-radius: 4px; display: flex; justify-content: space-between; }
.evcard .wgA { color: #fff; background: var(--us); padding: 0 6px; border-radius: 8px; }
.evcard .wgB { color: #fff; background: var(--br); padding: 0 6px; border-radius: 8px; }
.tgt { border: 1px solid #aaa; border-radius: 8px; padding: 6px 8px; margin: 6px 0; background: #fff; font-size: .82rem; }
.tgt table { border-collapse: collapse; margin-top: 4px; }
.tgt td, .tgt th { border: 1px solid #bbb; padding: 1px 4px; text-align: center; font-size: .7rem; }
.tgt td.hit { background: #f3d7a6; font-weight: bold; }
.tgt td.cur { outline: 3px solid #234a73; outline-offset: -2px; }

/* Combat view */
.combat { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.combat .colm { border-radius: 8px; padding: 6px; }
.combat .colm.US { background: #eef4fb; } .combat .colm.BR { background: #fbefee; }
.combat .pos { display: flex; align-items: center; gap: 6px; margin: 2px 0; font-size: .82rem; }
.combat .pos b { width: 18px; text-align: right; }
.combat .gap { color: var(--muted); font-style: italic; }

/* Selection lists */
.sel-list { display: flex; flex-direction: column; gap: 3px; max-height: 360px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; padding: 6px; background: #fff; }
.sel-list label { display: flex; gap: 6px; align-items: center; font-size: .9rem; }
.sel-group { font-weight: bold; font-size: .8rem; margin-top: 6px; color: #234a73; }

/* Assign editor */
.asg-force { border: 1px solid var(--line); border-radius: 8px; padding: 6px; margin: 6px 0; background: #fff; }
.asg-force .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.asg-ships { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.asg-ship { border: 1px solid #b7c9de; border-radius: 5px; padding: 2px 6px; font-size: .8rem; background: #f6f9fd; cursor: pointer; }
.asg-ship.on { background: #234a73; color: #fff; border-color: #234a73; }
.asg-ship.taken { opacity: .35; }

/* Log */
#log { max-height: 340px; overflow: auto; font-size: .82rem; font-family: ui-monospace, Menlo, Consolas, monospace; background: #fbfaf6; border: 1px solid var(--line); border-radius: 6px; padding: 6px; }
#log div { padding: 1px 0; border-bottom: 1px dotted #eee; white-space: pre-wrap; }
#log .turn { font-weight: bold; color: #234a73; }
#log .vp { color: #7a5a00; } #log .roll { color: #333; } #log .ai { color: var(--br); } #log .player { color: var(--us); } #log .combat { color: #4b2c62; }

/* Modal */
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 50; }
#modal.open { display: flex; }
#modal .inner { background: var(--panel); border-radius: 10px; max-width: 900px; width: 94vw; max-height: 88vh; overflow: auto; padding: 16px; }
.ref table { border-collapse: collapse; font-size: .82rem; margin: 6px 0 12px; }
.ref td, .ref th { border: 1px solid #c9c0ae; padding: 2px 6px; text-align: center; }
.ref th { background: #efe9dc; }

/* Setup */
.setup { max-width: 760px; margin: 30px auto; }
.setup .camp { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.setup .camp button { padding: 18px; font-size: 1.05rem; text-align: left; }
.setup .camp button.on { outline: 3px solid var(--gold); }
.setup label { display: block; margin: 6px 0; }
.banner { background: #fff6dc; border: 1px solid #e3c766; border-radius: 8px; padding: 8px 10px; margin: 8px 0; font-size: .9rem; }
.kbd { font-family: ui-monospace, monospace; font-size: .8rem; background: #eee; border-radius: 3px; padding: 0 4px; }

/* Narrow screens (phones / small tablets) */
@media (max-width: 1000px) {
  #app { grid-template-columns: minmax(0, 1fr); padding: 6px; gap: 8px; }
  #proc { position: static; max-height: none; }
  #board { min-width: 0; }
}
@media (max-width: 640px) {
  :root { font-size: 14px; }
  #hdr { gap: 6px 12px; padding: 6px 8px; position: static; }
  #hdr .btns { margin-left: 0; }
  .tracks { grid-template-columns: minmax(0, 1fr); }
  .trk { flex-wrap: wrap; }
  .niag { flex-wrap: wrap; }
  #lake { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ship { min-width: 0; max-width: 100%; }
  .combat { grid-template-columns: minmax(0, 1fr); }
  .setup .camp { grid-template-columns: minmax(0, 1fr); }
  .panel { padding: 8px; }
}
#board { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

</style>
</head>

/* ---- rng.js ---- */
/* Seeded RNG (mulberry32). The RNG state lives in the game state so that
   save / load / undo reproduce the same dice. */
function rngNext(s) {
  let t = (s.rng = (s.rng + 0x6D2B79F5) >>> 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function rint(s, n) { return Math.floor(rngNext(s) * n); }
function d6(s) { return rint(s, 6) + 1; }
function d10(s) { return rint(s, 10); }          // 0-9, as printed on the game's d10
function d10r(s) { return rint(s, 10) + 1; }     // 1-10 reading (Strike checks, upgrade table)
function twoD6(s) { return d6(s) + d6(s); }
function d66(s) { const r = d6(s), b = d6(s); return { red: r, blue: b, v: r * 10 + b }; }
function pick(s, arr) { return arr[rint(s, arr.length)]; }
function shuffle(s, arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = rint(s, i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

function crtColumnForRatio(r) {
  if (r < 2 / 3) return 0;
  if (r < 1) return 1;
  if (r < 1.5) return 2;
  if (r < 2) return 3;
  if (r < 2.5) return 4;
  if (r < 3) return 5;
  return 6;
}
function parseCrt(code) {
  const res = { aHits: 0, dHits: 0, aW: false, dW: false, end: false, code };
  if (code === 'End') { res.end = true; return res; }
  code.split('/').forEach(p => {
    const m = /^([AD])(\d+)(W?)$/.exec(p);
    if (!m) return;
    if (m[1] === 'A') { res.aHits = +m[2]; if (m[3]) res.aW = true; }
    else { res.dHits = +m[2]; if (m[3]) res.dW = true; }
  });
  return res;
}

/* Lake Combat Gunnery Hit Distribution Table (Player Aid VI) – block sizes of
   the 36 results (11..66) per position, for 1..18 Engaged ships, read from the
   full table reproduced in the British Living Rulebook example (p. 32); the U.S.
   rulebook's copy is cut off after column 12. Beyond 18 (possible only with
   Open Range's +5) the app picks a position uniformly. */
const HIT_DIST = {
  1: [36], 2: [18, 18], 3: [12, 12, 12], 4: [9, 9, 9, 9], 5: [7, 7, 8, 7, 7], 6: [6, 6, 6, 6, 6, 6],
  7: [5, 5, 5, 6, 5, 5, 5], 8: [3, 5, 5, 5, 5, 5, 5, 3], 9: [4, 4, 4, 4, 4, 4, 4, 4, 4],
  10: [2, 4, 4, 4, 4, 4, 4, 4, 4, 2], 11: [1, 4, 4, 4, 5, 4, 4, 4, 4, 1, 1], 12: [3, 3, 3, 3, 3, 3, 3, 3, 3, 3, 3, 3],
  13: [1, 3, 3, 3, 3, 3, 3, 3, 3, 3, 3, 3, 2],
  14: [2, 3, 3, 3, 3, 3, 3, 3, 3, 3, 3, 2, 1, 1],
  15: [2, 2, 2, 2, 2, 2, 4, 4, 4, 2, 2, 2, 2, 2, 2],
  16: [2, 2, 2, 2, 2, 2, 2, 4, 4, 2, 2, 2, 2, 2, 2, 2],
  17: [2, 2, 2, 2, 2, 2, 2, 3, 3, 2, 2, 2, 2, 2, 2, 2, 2],
  18: [2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2],
};
function d66Index(red, blue) { return (red - 1) * 6 + (blue - 1); } // 0..35
function hitPosition(nShips, red, blue) {
  const idx = d66Index(red, blue);
  const col = HIT_DIST[nShips];
  if (!col) return null;
  let acc = 0;
  for (let i = 0; i < col.length; i++) { acc += col[i]; if (idx < acc) return i + 1; }
  return col.length;
}

/* ============================================================================
   Procedure runner. Game flow is a stack of serialisable frames
   { proc, pc, A (args), L (locals), ret, answer }. Handlers return one of:
     G(pc)                    goto
     C(proc, args, thenPc)    call sub-procedure, resume at thenPc (f.ret holds result)
     R(value)                 return to caller
     P(prompt, thenPc)        wait for player input (f.answer) then resume at thenPc
   Everything in the state is plain JSON so save / load / undo are trivial.
   ========================================================================== */
const PROCS = {};
function G(pc) { return { goto: pc }; }
function C(proc, args, then) { return { call: proc, args: args || {}, then }; }
function R(v) { return { ret: v === undefined ? null : v }; }
function P(prompt, then) { return { prompt, then }; }

function topFrame(s) { return s.calls[s.calls.length - 1]; }

function run(s) {
  let guard = 0;
  while (!s.prompt && s.calls.length && !s.over) {
    if (++guard > 50000) throw new Error('Runaway procedure loop at ' + JSON.stringify(topFrame(s)).slice(0, 200));
    const f = topFrame(s);
    const proc = PROCS[f.proc];
    if (!proc) throw new Error('Unknown procedure ' + f.proc);
    const h = proc[f.pc];
    if (!h) throw new Error('No handler ' + f.proc + '.' + f.pc);
    const r = h(s, f);
    if (!r) throw new Error('Handler returned nothing: ' + f.proc + '.' + f.pc);
    if (r.goto !== undefined) f.pc = r.goto;
    else if (r.call) { f.pc = r.then; f.ret = undefined; s.calls.push({ proc: r.call, pc: 'start', A: r.args, L: {} }); }
    else if (r.ret !== undefined) { s.calls.pop(); const p = topFrame(s); if (p) p.ret = r.ret; }
    else if (r.prompt) {
      f.pc = r.then; f.answer = undefined;
      s.prompt = Object.assign({ id: (s.promptSeq = (s.promptSeq || 0) + 1) }, r.prompt);
    } else throw new Error('Bad handler result ' + JSON.stringify(r));
  }
}

function act(s, answer) {
  if (!s.prompt) throw new Error('No prompt pending');
  const err = validateAnswer(s, s.prompt, answer);
  if (err) throw new Error(err);
  const f = topFrame(s);
  f.answer = answer;
  s.prompt = null;
  run(s);
}

function validateAnswer(s, p, a) {
  if (p.kind === 'choice' || p.kind === 'info') {
    if (!p.options.some(o => o.id === a && !o.disabled)) return 'Invalid option ' + a;
  } else if (p.kind === 'select') {
    if (!Array.isArray(a)) return 'Selection must be an array';
    const ids = p.items.map(i => i.id);
    if (a.some(x => ids.indexOf(x) < 0)) return 'Unknown item in selection';
    if (p.min != null && a.length < p.min) return `Select at least ${p.min}`;
    if (p.max != null && a.length > p.max) return `Select at most ${p.max}`;
    if (p.validate) { const e = SELECT_VALIDATORS[p.validate](s, p, a); if (e) return e; }

function choice(title, text, options, extra) {
  return Object.assign({ kind: 'choice', title, text, options: options.map(o => typeof o === 'string' ? { id: o, label: o } : o) }, extra || {});
}
function info(title, text, extra) {
  return Object.assign({ kind: 'info', title, text, options: [{ id: 'ok', label: 'Continue', primary: true }] }, extra || {});
}
// Pause for the player to mirror AI moves (skipped when confirmAiSteps is off)
function aiPause(s, title, text, then, extra) {
  if (!s.options.confirmAiSteps) return G(then);
  return P(info(title, text, extra), then);
}
const SELECT_VALIDATORS = {};

/* Event deck ----------------------------------------------------------- */
function drawEvent(s, purpose, allowGale) {
  for (let tries = 0; tries < 200; tries++) {
    if (!s.deck.event.length) {
      const keep = [s.intelligence.US && s.intelligence.US.card, s.intelligence.BR && s.intelligence.BR.card].filter(Boolean);
      s.deck.event = shuffle(s, Object.keys(EVENTS).map(Number).filter(id => keep.indexOf(id) < 0));
      s.eventsDrawn = [];
      log(s, 'Event deck exhausted – reshuffled all Event Cards.', 'info');
    }
    const id = s.deck.event.shift();
    s.eventsDrawn.push({ id, purpose });
    if (id === 30 && !allowGale) { log(s, `Drew Event #30 Gale for ${purpose} – discarded and redrawn [2.5.1].`, 'event'); continue; }
    return EVENTS[id];
  }
  throw new Error('Event deck failure');
}

/* Tactic decks --------------------------------------------------------- */
function drawTactics(s, deckKey, n) {
  const key = deckKey === 'A' ? 'tacA' : 'tacD';
  const out = s.deck[key].slice(0, n);
  s.deck[key] = s.deck[key].slice(n);
  return out;
}
function returnTactics(s, deckKey, ids) {
  const key = deckKey === 'A' ? 'tacA' : 'tacD';
  s.deck[key] = shuffle(s, s.deck[key].concat(ids));
}

/* ============================================================================
   Turn procedure: Preparation (A), Lake Action (B), Enemy Operations (C),
   Breakout (D) and hand-off to Coastal (E) / Tally (F).
   ========================================================================== */
PROCS.turn = {
  start(s, f) {
    s.phase = 'prep';
    s.turnFlags = { aiCutOutThisTurn: false };
    s.eventsDrawn = []; s.pe = []; s.peNext = 1; s.targetRow = [];
    s.coastal = { raids: [], battles: [], cutouts: [] };
    s.convoyDeployed = { US: null, BR: null };
    s.lossesThisTurn = [];
    s.troopsReturning = { US: 0, BR: 0 };
    ZONES.forEach(z => { s.zones[z].event = null; s.zones[z].flags = {}; });
    ['US', 'BR'].forEach(side => { if (s.leader[side].wounded) { s.leader[side].wounded = false; log(s, `${leaderName(s, side)} returns to duty.`, 'info'); } });
    log(s, `===== ${TURN_NAMES[s.turn]} =====`, 'turn');
    // 5.1 Last turn sudden death: AI with no ships eligible to be Deployable
    return G('A1');
  },

  /* A1 Schedule Convoy ------------------------------------------------------------ */
  A1(s, f) {
    s.stepLabel = 'A1 Schedule Convoy';
    const h = s.human, m = Math.floor(s.turn / 2);
    if (s.turn % 2 === 0 && !s.convoys[h][m * 2] && !s.convoys[h][m * 2 + 1]) {
      return P(choice('A1 Schedule your Convoy', `Choose the turn your ${MONTHS[m]} supply Convoy runs. Place the ${MONTHS[m]} Convoy marker on that Turn Track space.`,
        [{ id: 'I', label: `${MONTHS[m]} I (this turn)`, primary: true }, { id: 'II', label: `${MONTHS[m]} II (next turn)` }]), 'A1b');
    }
    return G('A2');
  },
  A1b(s, f) {
    const h = s.human, m = Math.floor(s.turn / 2);
    const t = m * 2 + (f.answer === 'I' ? 0 : 1);
    s.convoys[h][t] = { real: true, revealed: true, delay: false, deployed: false, result: null };
    s.convoys[h][t === m * 2 ? m * 2 + 1 : m * 2] = { real: false, revealed: true };
    log(s, `Your ${MONTHS[m]} Convoy is scheduled for ${TURN_NAMES[t]}.`, 'player');
    return G('A2');
  },

  /* A2 New ships / upgrades ready ----------------------------------------------- */
  A2(s, f) {
    s.stepLabel = 'A2 New Ships Ready';
    const msgs = [];
    Object.values(s.ships).forEach(sh => {
      if (sh.box === 'makeReady') {
        if (sh.flags.upgrading && sh.ver === 'A') { sh.ver = 'B'; sh.steps = def(sh).full[4]; msgs.push(`${def(sh).name} completes her refit and joins as the “B” version`); }
        delete sh.flags.upgrading;
        sh.box = 'deployable';
        msgs.push(`${shipName(s, sh.id)} moves from Make Ready to Deployable`);
        if (sh.id === 'pike' && sh.owner === 'US') { s.flagship.US = 'pike'; msgs.push('USS Gen. Pike becomes the U.S. Flagship [LC5.1]'); }
      }
      if (sh.box === 'requisitioned' && sh.flags.reqUntil != null && s.turn >= sh.flags.reqUntil) {
        sh.box = 'deployable'; delete sh.flags.reqUntil; msgs.push(`${shipName(s, sh.id)} returns from Army requisition`);
      }
    });
    msgs.forEach(m => log(s, m, 'ship'));
    if (s.human === 'BR') return G('A2up');
    return G('A3');
  },
  // British Solo 7.1: roll for the maximum number of "A" ships that may go to Make Ready to upgrade
  A2up(s, f) {
    const cand = sideShips(s, 'BR').filter(sh => sh.ver === 'A' && !sh.isolated && (sh.box === 'deployable' || (sh.box === 'repairing' && !sh.delay)));
    const strip = sideShips(s, 'BR').filter(sh => sh.box === 'transit' && isCLS(sh));
    if (!cand.length) { return G('A3'); }
    const r = d10r(s);
    let n = upgradeLimit(r) + strip.length;
    f.L.upN = n;
    log(s, `Upgrade roll 1d10 = ${r} → up to ${upgradeLimit(r)} “A” ships${strip.length ? ` +${strip.length} for stripped captured Laker Schooners` : ''} may go to Make Ready.`, 'roll');
    if (!n) return G('A3');
    return P({ kind: 'select', title: 'A2 British Ship Upgrades', text: `Rolled ${r}: you may place up to ${n} “A” version ship(s) in Make Ready. They return next turn as their upgraded “B” version (7.1). Ships in Make Ready are not Deployable this turn.`,
      items: cand.map(sh => ({ id: sh.id, label: shipName(s, sh.id) + (sh.box === 'repairing' ? ' (finishing repairs)' : '') })), min: 0, max: n }, 'A2up2');
  },
  A2up2(s, f) {
    (f.answer || []).forEach(id => { const sh = s.ships[id]; sh.box = 'makeReady'; sh.steps = def(sh).full[4]; sh.flags.upgrading = true; log(s, `${shipName(s, id)} goes to Make Ready for upgrade.`, 'player'); });
    return G('A3');
  },

  /* A3 Repairs ----------------------------------------------------------------------- */
  A3(s, f) {
    s.stepLabel = 'A3 Repairs';
    const msgs = [];
    Object.values(s.ships).forEach(sh => {
      if (sh.box === 'repairing') {
        if (sh.delay > 0) { sh.delay--; msgs.push(`${shipName(s, sh.id)} stays in Repairing (delay marker removed)`); }
        else {
          sh.steps = def(sh).full[4];
          if (sh.flags.builtDamaged) { delete sh.flags.builtDamaged; sh.box = 'makeReady'; msgs.push(`${shipName(s, sh.id)} repaired – to Make Ready`); }
          else { sh.box = 'deployable'; msgs.push(`${shipName(s, sh.id)} repaired – Deployable`); }
        }
      }
    });
    Object.values(s.ships).forEach(sh => {
      if (sh.box === 'transit') {
        if (sh.owner === 'BR' && isCLS(sh)) { sh.box = 'outOfPlay'; msgs.push(`Captured ${def(sh).name} is stripped by the British and removed from play`); }
        else if (isReduced(sh)) { sh.box = 'repairing'; msgs.push(`${shipName(s, sh.id)} In Transit → Repairing`); }
        else { sh.box = 'deployable'; }
      }
      if (sh.box === 'ordinary' && sh.flags.damaged) { delete sh.flags.damaged; sh.box = 'repairing'; msgs.push(`${shipName(s, sh.id)} (Heated Shot damage) In Ordinary → Repairing`); }
    });
    msgs.forEach(m => log(s, m, 'ship'));
    return G('A4');
  },

  /* A4 In Ordinary / 30-point squadron limit ------------------------------------------ */
  A4(s, f) {
    s.stepLabel = 'A4 In Ordinary';
    // A.I.: re-activate laid-up ships, then enforce the 30 Close Action limit
    aiSquadronLimit(s);
    const h = s.human;
    const pool = sideShips(s, h).filter(sh => (sh.box === 'deployable' || (sh.box === 'ordinary' && !sh.flags.damaged)));
    if (!pool.length) return G('A5');
    const total = sumBy(pool.filter(sh => sh.box === 'deployable'), ca);
    return P({ kind: 'select', title: 'A4 In Ordinary? (30-point limit)', validate: 'squadron30',
      text: `Select the ships to keep In Ordinary this turn (laid up, not Deployable). Your Deployable squadron may total at most 30 Close Action points [5.2]. Current Deployable total: ${total}.`,
      items: pool.map(sh => ({ id: sh.id, label: `${shipName(s, sh.id)} – CA ${ca(sh)}`, ca: ca(sh) })),
      initial: pool.filter(sh => sh.box === 'ordinary').map(sh => sh.id), min: 0, max: pool.length }, 'A4b');
  },
  A4b(s, f) {
    const sel = f.answer || [];
    sideShips(s, s.human).forEach(sh => {
      if (sh.box === 'ordinary' && !sh.flags.damaged && sel.indexOf(sh.id) < 0) { sh.box = 'deployable'; log(s, `${shipName(s, sh.id)} recommissioned from In Ordinary.`, 'player'); }
      else if (sh.box === 'deployable' && sel.indexOf(sh.id) >= 0) { sh.box = 'ordinary'; log(s, `${shipName(s, sh.id)} placed In Ordinary.`, 'player'); }
    });
    return G('A5');
  },

  /* A5 Naval Construction ---------------------------------------------------------- */
  A5(s, f) {
    s.stepLabel = 'A5 Naval Construction';
    Object.keys(CONSTRUCTION_TRIGGERS).forEach(id => {
      const t = CONSTRUCTION_TRIGGERS[id], sh = s.ships[id];
      if (!sh || sh.box !== 'construction') return;
      if (s.supply[t.side] >= t.space) {
        if (s.cd[t.side] > 0) { log(s, `${def(sh).name} is ready to launch but ${SIDE_SHORT[t.side]} Construction Delay is ${s.cd[t.side]} – she stays in Construction.`, 'ship'); return; }
        if (isReduced(sh)) { sh.box = 'repairing'; sh.flags.builtDamaged = true; log(s, `${def(sh).name} is launched damaged (Shipyard Damage) – to Repairing.`, 'ship'); }
        else { sh.box = 'makeReady'; log(s, `${def(sh).name} launched – Construction → Make Ready (Deployable next turn).`, 'ship'); }
      }
    });
    changeCD(s, 'US', -1, 'free reduction A5'); changeCD(s, 'BR', -1, 'free reduction A5');
    aiConstructionDelayPurchase(s);
    if (s.cd[s.human] > 0) {
      const pool = deployable(s, s.human).filter(sh => ca(sh) > 0);
      if (pool.length) return P({ kind: 'select', title: 'A5 Buy down Construction Delay?',
        text: `Your Construction Delay is ${s.cd[s.human]}. Optionally place more ships In Ordinary: every 2 Close Action points placed In Ordinary lowers Construction Delay by 1 [8.1].`,
        items: pool.map(sh => ({ id: sh.id, label: `${shipName(s, sh.id)} – CA ${ca(sh)}` })), min: 0, max: pool.length }, 'A5b');
    }
    return G('A6');
  },
  A5b(s, f) {
    const sel = (f.answer || []).map(id => s.ships[id]);
    if (sel.length) {
      const pts = sumBy(sel, ca);
      sel.forEach(sh => { sh.box = 'ordinary'; });
      log(s, `Placed In Ordinary: ${sel.map(sh => shipName(s, sh.id)).join(', ')} (${pts} CA).`, 'player');
      changeCD(s, s.human, -Math.floor(pts / 2), 'ships placed In Ordinary');
    }
    return G('A6');
  },

  /* A6 Naval Balance ----------------------------------------------------------------- */
  A6(s, f) {
    s.stepLabel = 'A6 Naval Balance';
    if (s.turn > 0) { s.nb = computeNavalBalance(s); s.nbBand = navalBalanceBand(s.nb); }
    log(s, `Naval Balance ${s.nb >= 0 ? '+' : ''}${s.nb} → band “${NB_LABELS[s.nbBand]}” (${NB_CARDS[s.human][s.nbBand]} Target Cards).`, 'track');
    return G('A7');
  },

  /* A7 Assign ships ------------------------------------------------------------------- */
  A7(s, f) {
    s.stepLabel = 'A7 Assign Ships';
    s.phase = 'prep';
    // Flagships [LC5.1]
    ['US', 'BR'].forEach(side => {
      const fs = s.ships[s.flagship[side]];
      if (side === 'US' && s.ships.pike.owner === 'US' && s.ships.pike.box === 'deployable' && s.flagship.US !== 'pike' && !s.turnFlags.pikeFlagDone) { s.flagship.US = 'pike'; s.turnFlags.pikeFlagDone = true; }
      if (!fs || fs.owner !== side || fs.box !== 'deployable') {
        const cand = deployable(s, side).sort((a, b) => vpCapture(b) - vpCapture(a) || ca(b) - ca(a));
        if (cand.length) { s.flagship[side] = cand[0].id; log(s, `New ${SIDE_SHORT[side]} Flagship: ${shipName(s, cand[0].id)}.`, 'ship'); }
      }
    });
    return P(buildAssignPrompt(s), 'A7b');
  },
  A7b(s, f) {
    applyAssignment(s, f.answer);
    return G('A8');
  },

  /* A8 reveal AI Troops ------------------------------------------------------------- */
  A8(s, f) {
    s.stepLabel = 'A8 AI Troops';
    let rev = 0, dum = 0;
    s.aiTroops.box = s.aiTroops.box.filter(m => {
      if (!m.revealed) { m.revealed = true; if (m.troops) rev++; else { dum++; return false; } }
      return true;
    });
    if (rev || dum) log(s, `A8: revealed AI Troops markers – ${rev} Troops, ${dum} dummy (discarded).`, 'ai');
    log(s, `AI Available Troops this turn: ${aiTroopsInBox(s)}.`, 'ai');
    return G('A9');
  },

  /* A9 / A10 Target Cards ---------------------------------------------------------- */
  A9(s, f) {
    s.stepLabel = 'A9-A10 Target Cards';
    const deckId = s.human === 'US' ? 'A' : 'B';
    let ids = Object.keys(TARGET_CARDS).filter(k => TARGET_CARDS[k].deck === deckId);
    const removed = [];
    if (s.turn === 7) { const r = ids.filter(k => TARGET_CARDS[k].lastTurn); removed.push(`${r.length} final-turn cards`); ids = ids.filter(k => !TARGET_CARDS[k].lastTurn); }
    if (usingTempHomeport(s, s.ai)) { const r = ids.filter(k => TARGET_CARDS[k].isolated); removed.push(`${r.length} hourglass cards (AI Isolated ships)`); ids = ids.filter(k => !TARGET_CARDS[k].isolated); }
    s.deck.target = shuffle(s, ids);
    const n = NB_CARDS[s.human][s.nbBand];
    let row = s.deck.target.slice(0, n);
    s.deck.target = s.deck.target.slice(n);
    // Blockaded AI Homeport: AI homeport-zone cards to the left; search for one if none
    if (isBlockaded(s, s.ai)) {
      const hz = homeZone(s.ai);
      let hzCards = row.filter(k => TARGET_CARDS[k].zone === hz);
      if (!hzCards.length) {
        const fromDeck = s.deck.target.find(k => TARGET_CARDS[k].zone === hz);
        if (fromDeck) { s.deck.target = s.deck.target.filter(k => k !== fromDeck); hzCards = [fromDeck]; row = [fromDeck].concat(row); }
      }
      row = hzCards.concat(row.filter(k => TARGET_CARDS[k].zone !== hz));
    }
    s.targetRow = row.map(id => ({ id, revealed: false, removed: false, enc: false }));
    log(s, `Drew ${n} Target Cards${removed.length ? ' (removed ' + removed.join(', ') + ')' : ''}. Row backs (left→right): ${s.targetRow.map(c => ZONE_NAME[TARGET_CARDS[c.id].zone]).join(' · ')}.`, 'ai');
    return aiPause(s, 'A10 Target Cards drawn', `Lay out ${n} Target Cards face down, left to right, showing these zones:\n${s.targetRow.map((c, i) => `${i + 1}. ${ZONE_NAME[TARGET_CARDS[c.id].zone]}`).join('\n')}`, 'B1');
  },

  /* B Lake Action ---------------------------------------------------------------------- */
  B1(s, f) {
    s.phase = 'lake'; s.stepLabel = 'B1 Possible Encounters';
    // Number Possible Encounters by row order
    f.L.zoneCounters = {};
    f.L.pending = [];
    s.targetRow.forEach((c, idx) => {
      const z = TARGET_CARDS[c.id].zone;
      if (forcesInZone(s, z, s.human).length) f.L.pending.push({ idx, zone: z });
    });
    f.L.zonesNeedingChoice = [...new Set(f.L.pending.map(p => p.zone))].filter(z => forcesInZone(s, z, s.human).length > 1);
    f.L.firstForce = {};
    return G('B1choose');
  },
  B1choose(s, f) {
    const z = f.L.zonesNeedingChoice.shift();
    if (!z) return G('B1place');
    f.L.curZone = z;
    const fs = forcesInZone(s, z, s.human);
    return P(choice(`B1 Possible Encounters in ${ZONE_NAME[z]}`, `${f.L.pending.filter(p => p.zone === z).length} Possible Encounter marker(s) fall in ${ZONE_NAME[z]}, where you have ${fs.length} Forces. Choose the Force that receives the first marker; further markers rotate evenly through your other Forces there [10.1.2].`,
      fs.map(x => ({ id: x.id, label: forceLabel(s, x) }))), 'B1choose2');
  },
  B1choose2(s, f) { f.L.firstForce[f.L.curZone] = f.answer; return G('B1choose'); },
  B1place(s, f) {
    const rot = {};
    f.L.pending.forEach(p => {
      let fs = forcesInZone(s, p.zone, s.human);
      if (f.L.firstForce[p.zone]) { const i = fs.findIndex(x => x.id === f.L.firstForce[p.zone]); fs = fs.slice(i).concat(fs.slice(0, i)); }
      rot[p.zone] = rot[p.zone] || 0;
      const force = fs[rot[p.zone] % fs.length]; rot[p.zone]++;
      s.pe.push({ num: s.peNext++, zone: p.zone, forceId: force.id, idx: p.idx, status: 'possible' });
    });
    if (!s.pe.length) { log(s, 'B1: no Possible Encounters this turn.', 'ai'); return G('C1'); }
    log(s, `B1: Possible Encounters – ${s.pe.map(p => `PE${p.num} ${ZONE_NAME[p.zone]} (card ${p.idx + 1})`).join(', ')}.`, 'ai');
    return aiPause(s, 'B1 Possible Encounters', `Place Possible Encounter markers:\n${s.pe.map(p => `PE${p.num} on your ${forceLabel(s, s.forces[p.forceId])} in ${ZONE_NAME[p.zone]}`).join('\n')}`, 'B2');
  },
  B2(s, f) {
    s.stepLabel = 'B2 Encounter Checks';
    const pe = s.pe.find(p => p.status === 'possible');
    if (!pe) return G('C1');
    if (!aiHasDeployable(s, 'lake')) {
      s.pe.filter(p => p.status === 'possible').forEach(p => { p.status = 'discarded'; });
      log(s, 'No AI Deployable ships remain – remaining Possible Encounter markers removed.', 'ai');
      return G('C1');
    }
    let force = s.forces[pe.forceId];
    if (!force || force.zone !== pe.zone || !force.ships.length || force.side !== s.human) {
      // 11.1.3: transfer the marker to another of your Forces still in the zone, if any
      const other = forcesInZone(s, pe.zone, s.human)[0];
      if (!other) { pe.status = 'discarded'; log(s, `PE${pe.num}: you have no Force left in ${ZONE_NAME[pe.zone]} – marker discarded.`, 'ai'); return G('B2'); }
      pe.forceId = other.id; force = other;
      log(s, `PE${pe.num} transferred to your ${forceLabel(s, other)}.`, 'ai');
    }
    const ev = drawEvent(s, `Encounter Check PE${pe.num}`, false);
    if (!ev.spy) {
      pe.status = 'discarded';
      log(s, `PE${pe.num} ${ZONE_NAME[pe.zone]}: Event #${ev.id} – no spyglass, false alarm.`, 'event');
      return aiPause(s, `Encounter Check PE${pe.num}`, `Event Card #${ev.id} (${EVENT_TITLE[ev.lake]}): no man-with-spyglass – false alarm. Remove PE${pe.num}.`, 'B2', { eventCard: ev.id });
    }
    pe.status = 'encounter';
    s.targetRow[pe.idx].revealed = true; s.targetRow[pe.idx].enc = true;
    log(s, `PE${pe.num} ${ZONE_NAME[pe.zone]}: Event #${ev.id} shows the spyglass – ENCOUNTER ${pe.num}! Target Card ${s.targetRow[pe.idx].id} revealed.`, 'event');
    f.L.pe = pe.num;
    return C('aiDeploy', { cardIdx: pe.idx, zone: pe.zone, phase: 'lake', encounter: true, humanForceId: pe.forceId, peNum: pe.num }, 'B2after');
  },
  B2after(s, f) {
    const pe = s.pe.find(p => p.num === f.L.pe);
    const res = f.ret;
    if (!res || res.none || res.convoyHandled) {
      // A confirmed Encounter with no A.I. deployment (or an unescorted Convoy) still ends your Force's
      // Encounter: it gets an Encounter Ended marker, so a Cutting-Out or other mission cannot go on
      pe.status = 'ended';
      const hf = s.forces[pe.forceId];
      if (hf && hf.side === s.human) hf.ended = true;
      return G('B2');
    }
    return C('encounter', { zone: pe.zone, kind: res.convoy ? 'convoy' : 'normal', convoySide: res.convoy || null, peNum: pe.num, humanForces: res.escortForces || [pe.forceId], aiForces: res.forces, startAt: 'event' }, 'B2done');
  },
  B2done(s, f) {
    const pe = s.pe.find(p => p.num === f.L.pe);
    pe.status = 'ended';
    return G('B2');
  },

  /* C Enemy Operations ------------------------------------------------------------- */
  C1(s, f) {
    s.phase = 'enemy'; s.stepLabel = 'C Enemy Operations';
    if (!aiHasDeployable(s)) {
      log(s, 'C1: the AI has no Deployable ships – no Enemy Operations.', 'ai');
      s.targetRow.forEach(c => { c.removed = true; });
      return G('D1');
    }
    // C2 edit the row
    s.targetRow.forEach(c => {
      if (c.enc) c.removed = true;
      else if (shipsInZone(s, TARGET_CARDS[c.id].zone, s.human).length) c.removed = true;
    });
    const left = s.targetRow.filter(c => !c.removed);
    if (!left.length) { log(s, 'C2: no Target Cards remain – no Enemy Operations.', 'ai'); return G('D1'); }
    left.forEach(c => { c.revealed = true; });
    log(s, `C3: revealed ${left.map(c => c.id + ' ' + ZONE_NAME[TARGET_CARDS[c.id].zone] + ' ' + MISSION_NAME[TARGET_CARDS[c.id].mission]).join('; ')}.`, 'ai');
    f.L.queue = s.targetRow.map((c, i) => i).filter(i => !s.targetRow[i].removed);
    return aiPause(s, 'C Enemy Operations', `Remove the Target Cards for Encounters and for zones containing your ships. Reveal the rest (left → right):\n${left.map(c => `${c.id}: ${ZONE_NAME[TARGET_CARDS[c.id].zone]} – ${MISSION_NAME[TARGET_CARDS[c.id].mission]}${TARGET_CARDS[c.id].secondary ? ' (' + MISSION_NAME[TARGET_CARDS[c.id].secondary] + ')' : ''}`).join('\n')}`, 'C4');
  },
  C4(s, f) {
    if (!f.L.queue.length) return G('D1');
    if (!aiHasDeployable(s)) return G('D1');
    if (s.human === 'BR' && aiDeployablePool(s).length < 2) { log(s, 'Enemy Operations end: fewer than two AI Deployable ships remain.', 'ai'); return G('D1'); }
    const idx = f.L.queue.shift();
    const c = s.targetRow[idx];
    return C('aiDeploy', { cardIdx: idx, zone: TARGET_CARDS[c.id].zone, phase: 'enemy', encounter: false }, 'C4b');
  },

    c.col[c.att] = buildColumn(s, attIds, tows, c.att);
    c.col[c.def] = buildColumn(s, defendingIds(s, c.def), {}, c.def);
    // Missed Signal: the ship sits out the first Round her Force fights
    c.sitting = null;
    const ms = missedSignalShip(s);
    if (ms) {
      ['US', 'BR'].forEach(sd => { if (c.col[sd].indexOf(ms) >= 0) { c.sitting = { id: ms, side: sd }; c.col[sd] = c.col[sd].filter(x => x !== ms); } });
      if (c.sitting) { zf.missedSignalUsed = true; log(s, `Missed Signal: ${shipName(s, c.sitting.id)} sits out this Round.`, 'event'); }
    }
    log(s, `Line of battle – ${SIDE_SHORT[c.att]} (attacking): ${c.col[c.att].map((id, i) => (i + 1) + '.' + shipName(s, id)).join(' ')}${Object.keys(tows).length ? ' [towing: ' + Object.keys(tows).map(t => def(s.ships[t]).name + '→' + def(s.ships[tows[t]]).name).join(', ') + ']' : ''}; ${SIDE_SHORT[c.def]} (defending): ${c.col[c.def].map((id, i) => (i + 1) + '.' + shipName(s, id)).join(' ')}.`, 'combat');
    if (!c.col[c.att].length) return R({ outcome: 'segmentEnd' });
    if (c.segment === 'patrol' && zf.rainy) {
      c.rainy = true;
      c.pos = SEQ_STEPS[c.seq].indexOf('CA');
      log(s, 'Rainy Squalls: skip directly to the Close Action Round.', 'event');
      return G('next');
    }
    return G('tactics');
  },

  /* LC3 Tactics ------------------------------------------------------------------------- */
  tactics(s, f) {
    const c = cmb(s), h = s.human;
    const hDeck = c.att === h ? 'A' : 'D';
    const drawn = drawTactics(s, hDeck, 4);
    const valid = drawn.filter(id => tacticValid(s, id, h));
    f.L.hDrawn = drawn; f.L.hDeck = hDeck;
    if (!valid.length) { f.answer = null; log(s, `Your Tactics draw: ${drawn.map(id => TACTIC_BY_ID[id].name).join(', ')} – none valid.`, 'combat'); return G('tactics2'); }
    return P({ kind: 'choice', title: `LC3 Tactics – you are the ${c.att === h ? 'Attacker' : 'Defender'}`,
      text: `You drew: ${drawn.map(id => TACTIC_BY_ID[id].name).join(', ')}.\nInvalid (dummy / other side / matches a symbol on the Weather Gage card ${wgSymbolsText(s)}) are discarded. Select one valid Tactic to play.`,
      options: valid.map(id => ({ id, label: TACTIC_BY_ID[id].name, desc: TACTIC_BY_ID[id].text, color: TACTIC_BY_ID[id].color })), tactic: true }, 'tactics2');
  },
  tactics2(s, f) {
    const c = cmb(s), h = s.human, ai = s.ai;
    const hPick = f.answer || null;
    returnTactics(s, f.L.hDeck, f.L.hDrawn.filter(id => id !== hPick));
    const aDeck = c.att === ai ? 'A' : 'D';
    const aDrawn = drawTactics(s, aDeck, 5);
    const aValid = aDrawn.filter(id => tacticValid(s, id, ai));
    const aPick = aValid.length ? pick(s, aValid) : null;
    returnTactics(s, aDeck, aDrawn.filter(id => id !== aPick));
    const attPick = c.att === h ? hPick : aPick, defPick = c.att === h ? aPick : hPick;
    c.tac.att = attPick ? { id: attPick, used: false, negated: false } : null;
    c.tac.def = defPick ? { id: defPick, used: false, negated: false } : null;
    const lines = [];
    if (c.tac.att && c.tac.def) {
      const ta = TACTIC_BY_ID[c.tac.att.id], td = TACTIC_BY_ID[c.tac.def.id];
      if (ta.color && ta.color === td.color) { c.tac.att.negated = c.tac.def.negated = true; lines.push(`Matching color bars (${ta.color}) – both Tactics negate each other.`); }
      if (td.id === 'D_repel' && ta.id === 'A_grapple') { c.tac.att.negated = true; lines.push('Repel negates Grapple.'); }
      if (td.id === 'D_mutual' && (ta.id === 'A_rake' || ta.id === 'A_outmaneuver')) { c.tac.att.negated = true; lines.push(`Mutual Support negates ${ta.name}.`); }
    }
    const desc = (t, who) => t ? `${who}: ${TACTIC_BY_ID[t.id].name}${t.negated ? ' (negated)' : ''}` : `${who}: none`;
    lines.unshift(`A.I. drew ${aDrawn.map(id => TACTIC_BY_ID[id].name).join(', ')} → plays ${aPick ? TACTIC_BY_ID[aPick].name : 'nothing'}.`);
    lines.push(desc(c.tac.att, 'Attacker'), desc(c.tac.def, 'Defender'));
    lines.forEach(l => log(s, l, 'combat'));
    s.tacPlayed = (s.tacPlayed || []).concat([attPick, defPick].filter(Boolean));
    return P(info('Tactics', lines.join('\n'), { tacticsShown: [attPick, defPick].filter(Boolean) }), 'next');
  },

  /* Sequence dispatcher ------------------------------------------------------------------- */
  next(s, f) {
    const c = cmb(s);
    const st = SEQ_STEPS[c.seq][c.pos];
    s.stepLabel = `Lake Combat – Sequence ${c.seq}: ${({ GR1: 'Gunnery Round 1', GR2: 'Gunnery Round 2', WG: 'Weather Gage recheck', CA: 'Close Action Round', END: 'Segment ends' })[st]}`;
    if (!colShips(c, c.def).length || !encIds(s, c.def).length) return R({ outcome: 'encounterEnd' });
    if (!encIds(s, c.att).length) return R({ outcome: 'encounterEnd' });
    if (st === 'GR1' || st === 'GR2') return G('gr');
    if (st === 'WG') return G('wg');
    if (st === 'CA') return G('ca');
    return R({ outcome: 'segmentEnd' });
  },

  /* LC4 Gunnery Round --------------------------------------------------------------------- */
  gr(s, f) {
    const c = cmb(s);
    const st = SEQ_STEPS[c.seq][c.pos];
    f.L.st = st;
    const attackers = colShips(c, c.att).filter(id => isFull(s.ships[id]) && s.encounter.ships[id] === 'in');
    if (!attackers.length) { log(s, `${SIDE_SHORT[c.att]} has no full-strength ships left to attack – the Segment ends.`, 'combat'); return R({ outcome: 'segmentEnd' }); }
    const needDecision = st === 'GR2' || c.newSeq;
    c.newSeq = false;
    if (needDecision) {
      if (c.att === s.ai) {
        const plan = aiPlanFor(s, s.ai, attackers.filter(id => !(s.ai === 'BR' && isCLS(s.ships[id]))), colShips(c, c.def), false);
        if (!plan.ships.length) { log(s, `A.I. passes: ${plan.why}`, 'ai'); s.encounter.lastEnd = 'pass'; return P(info('The A.I. breaks off', `${plan.why}\nThe current Segment ends.`), '__segEnd'); }
      } else {
        return P(choice(`${st === 'GR2' ? 'Gunnery Round 2' : 'New Combat Sequence'} – attack or pass?`, `${combatSummary(s)}\nYou hold the Weather Gage. Attack again, or Pass (the current Segment ends)?`,
          [{ id: 'attack', label: 'Attack', primary: true }, { id: 'pass', label: 'Pass' }], { combatPreview: true }), 'grDecide');
      }
    }
    return G('grOut');
  },
  __segEnd(s, f) { return R({ outcome: 'segmentEnd' }); },
  grDecide(s, f) {
    if (f.answer === 'pass') { log(s, 'You Pass – the Segment ends.', 'player'); s.encounter.lastEnd = 'pass'; return R({ outcome: 'segmentEnd' }); }
    return G('grOut');
  },
  grOut(s, f) {
    // Attacker Outmaneuver in Gunnery Round 2: pick a separated Defender subgroup
    const c = cmb(s);
    if (f.L.st === 'GR2' && tacActive(c, 'att', 'A_outmaneuver')) {
      const groups = subgroups(c.col[c.def]);
      if (groups.length > 1) {
        if (c.att === s.human) {
          return P(choice('Outmaneuver – choose the Defender subgroup', `Your Outmaneuver Tactic lets you fire your full strength at one subgroup:`,
            groups.map((g, i) => ({ id: 'g' + i, label: g.map(id => shipName(s, id)).join(', ') }))), 'grOut2');
        }
        // AI: subgroup giving the best odds, then most VP
        let best = 0, bestScore = -1;
        groups.forEach((g, i) => { const sc = 1000 / Math.max(0.1, sideStrength(s, g, c.att)) + sumBy(g.map(id => s.ships[id]), vpCapture) / 1000; if (sc > bestScore) { bestScore = sc; best = i; } });
        f.answer = 'g' + best;
        return G('grOut2');
      }
    }
    f.L.subgroup = null;
    return G('grRoll');
  },
  grOut2(s, f) {
    const c = cmb(s);
    const groups = subgroups(c.col[c.def]);
    f.L.subgroup = groups[+String(f.answer).slice(1)] || null;
    if (f.L.subgroup) log(s, `Outmaneuver: the attack concentrates on ${f.L.subgroup.map(id => shipName(s, id)).join(', ')}.`, 'combat');
    return G('grRoll');
  },
  grRoll(s, f) {
    const c = cmb(s), e = s.encounter, zf = zoneFlags(s), st = f.L.st;
    c.gr++;
    const isGR1 = st === 'GR1';
    const noLG = isGR1 && hazeActive(s);
    if (noLG) zf.hazeUsed = true;
    const attackers = colShips(c, c.att).filter(id => isFull(s.ships[id]));
    c.roundAttackers = attackers.slice();
    const defenders = f.L.subgroup || colShips(c, c.def);
    const aStr = sideStrength(s, attackers, c.att, noLG), dStr = sideStrength(s, defenders, c.att, noLG);
    const ratio = dStr <= 0 ? 99 : aStr / dStr;
    let colIdx = crtColumnForRatio(ratio);
    const shifts = [], drms = [];
    if (tacActive(c, 'att', 'A_surprise') && isGR1 && c.segment === 'patrol') { colIdx++; shifts.push('+1 Surprise'); useTac(c, 'att'); }
    colIdx = Math.max(0, Math.min(6, colIdx));
    let drm = 0;
    const fl = s.flagship[c.att];
    if (attackers.indexOf(fl) >= 0 && commandDRMAvailable(s, c.att)) { drm++; drms.push(`+1 Command (${leaderName(s, c.att)})`); }
    if (c.att === 'US' && !tacActive(c, 'att', 'A_sweep')) {
      const towed = towedInRound(c, attackers);
      const untowed = attackers.filter(id => isCLS(s.ships[id]) && towed.indexOf(id) < 0);
      if (untowed.length) {
        const r = d6(s), n = untowed.length;
        const pen = r <= n / 2 ? -2 : r <= n ? -1 : 0;
        if (pen) { drm += pen; }
        drms.push(`${pen} untowed Laker Schooners (${n}, d6 ${r})`);
      }
    }
    if (tacActive(c, 'att', 'A_rof')) { drm++; drms.push('+1 Rate of Fire'); }
    if (tacActive(c, 'def', 'D_rof')) { drm--; drms.push('−1 Defender Rate of Fire'); }
    const defRake = tacActive(c, 'def', 'D_rake') && !c.tac.def.used;
    if (defRake) { drm--; drms.push('−1 Defender Rake'); }
    const rollOnce = () => { const r = d10(s); const m = Math.max(0, Math.min(9, r + drm)); return { r, m, code: CRT[m][colIdx] }; };
    let roll = rollOnce();
    const rolls = [roll];
    const breakout = e.kind === 'breakout';
    let guard = 0;
    while (breakout && roll.code === 'End' && guard++ < 20) { roll = rollOnce(); rolls.push(roll); }
    let res = parseCrt(roll.code);
    // First Shot re-rolls
    if (tacActive(c, 'att', 'A_firstshot') && !c.tac.att.used && (res.aW || res.aHits > res.dHits)) { useTac(c, 'att'); roll = rollOnce(); rolls.push(roll); res = parseCrt(roll.code); }
    if (tacActive(c, 'def', 'D_firstshot') && !c.tac.def.used && (res.dW || res.dHits > res.aHits)) { useTac(c, 'def'); roll = rollOnce(); rolls.push(roll); res = parseCrt(roll.code); }
    while (breakout && res.end && guard++ < 40) { roll = rollOnce(); rolls.push(roll); res = parseCrt(roll.code); }
    if (tacActive(c, 'att', 'A_firstshot')) useTac(c, 'att');
    if (tacActive(c, 'def', 'D_firstshot')) useTac(c, 'def');
    const notes = [];
    if (tacActive(c, 'att', 'A_sweep')) { if (res.aHits || res.aW) notes.push('Sweep Up & Fire: Attacker hits/withdrawal ignored'); res.aHits = 0; res.aW = false; }
    if (tacActive(c, 'def', 'D_escape') && !c.tac.def.used) { res.dW = true; res.escape = true; useTac(c, 'def'); notes.push('Escape: Defender withdraws; hit Defenders automatically pass Disengagement'); }
    if (defRake) { c.tac.def.used = true; res.defRake = true; }
    const txt = `${st === 'GR1' ? 'Gunnery Round 1' : 'Gunnery Round 2'}: ${SIDE_SHORT[c.att]} ${fmt(aStr)} vs ${SIDE_SHORT[c.def]} ${fmt(dStr)}${noLG ? ' (Haze: no Long Guns)' : ''} = ${fmt(ratio)}:1 → column ${CRT_COLS[colIdx]}${shifts.length ? ' (' + shifts.join(', ') + ')' : ''}. ` +
      `d10 ${rolls.map(x => x.r + (drm ? (drm > 0 ? '+' : '') + drm + '=' + x.m : '') + ' ' + x.code).join(', then ')}${drms.length ? ' [' + drms.join('; ') + ']' : ''} → ${roll.code}${notes.length ? ' (' + notes.join('; ') + ')' : ''}.`;
    log(s, txt, 'roll');
    f.L.res = res; f.L.txt = txt; f.L.defenders = defenders;
    // Attacker Rake: choose the target of ALL defender hits
    if (res.dHits && tacActive(c, 'att', 'A_rake') && !c.tac.att.used) {
      const colD = colShips(c, c.def);
      if (c.att === s.human) {
        // Card A06: the human may determine the random ship first, then choose the best of the three
        f.L.rakeRandom = pick(s, colD);
        return P(choice('Rake – where do the hits go?', `${txt}\nApply ALL ${res.dHits} hit(s) to one ship (the random ship has already been rolled):`,
          [{ id: 'lead', label: `Lead ship: ${shipName(s, colD[0])}` }, { id: 'rear', label: `Rear ship: ${shipName(s, colD[colD.length - 1])}` }, { id: 'random', label: `Random ship: ${shipName(s, f.L.rakeRandom)}` }]), 'grRake');
      }
      const opts = [colD[0], colD[colD.length - 1], pick(s, colD)];
      f.L.rakeTarget = opts.sort((a, b) => vpCapture(s.ships[b]) - vpCapture(s.ships[a]))[0];
      log(s, `A.I. Rake: all hits on ${shipName(s, f.L.rakeTarget)}.`, 'combat');
      spendRake(s, c);
    }
    return G('grApply');
  },
  grRake(s, f) {
    const c = cmb(s), colD = colShips(c, c.def);
    f.L.rakeTarget = f.answer === 'lead' ? colD[0] : f.answer === 'rear' ? colD[colD.length - 1] : (f.L.rakeRandom && colD.indexOf(f.L.rakeRandom) >= 0 ? f.L.rakeRandom : pick(s, colD));
    log(s, `Rake: all hits on ${shipName(s, f.L.rakeTarget)}.`, 'combat');
    spendRake(s, c);
    return G('grApply');
  },
  grApply(s, f) {
    const c = cmb(s), res = f.L.res;
    const lines = [f.L.txt];
    if (res.end) { lines.push('END – the current Segment ends immediately.'); log(s, 'END – the current Segment ends immediately.', 'combat'); f.L.outcome = 'segmentEnd'; return P(info('Gunnery result', lines.join('\n'), { combatView: true }), 'finishRound'); }
    // distribute hits
    const dMap = {}, aMap = {};
    if (res.dHits) {
      if (f.L.rakeTarget) dMap[f.L.rakeTarget] = res.dHits;
      else distributeHits(s, c.col[c.def], res.dHits, dMap, lines, { openRange: c.def === 'BR' && tacActive(c, 'def', 'D_openrange'), subgroup: f.L.subgroup, side: c.def });
    }
    if (res.aHits) {
      // Only the ships attacking in this Gunnery Round are in the attacker's column for this Round; Reduced ships
      // stay behind in the previous Round zone (LC5 "column of ships for this Gunnery Round"; Playbook p.15).
      const attCol = c.col[c.att].filter(id => id && (c.roundAttackers || []).indexOf(id) >= 0);
      if (res.defRake) distributeHits(s, attCol, res.aHits, aMap, lines, { forceCol: 2, side: c.att });
      else distributeHits(s, attCol, res.aHits, aMap, lines, { side: c.att });
    }
    const ctx = { round: 'GR', escapeSide: res.escape ? c.def : null };
    const rd = applyHits(s, c.def, dMap, ctx, lines);
    const ra = applyHits(s, c.att, aMap, ctx, lines);
    f.L.failedDis = { [c.def]: rd.stayed, [c.att]: ra.stayed };
    f.L.hit = { [c.def]: Object.keys(dMap), [c.att]: Object.keys(aMap) };
    f.L.lines = lines;
    f.L.wQueue = [];
    if (res.dW) f.L.wQueue.push(c.def);
    if (res.aW) f.L.wQueue.push(c.att);
    return G('withdraw');
  },
  withdraw(s, f) {
    const c = cmb(s);
    const side = f.L.wQueue.shift();
    if (!side) return G('flagTransfer');
    const eligible = withdrawEligible(s, side, f.L.failedDis[side]);
    // Pursuit (card A05): only if the Defender has ships eligible to withdraw after Hits and Disengagement Checks
    if (side === c.def && tacActive(c, 'att', 'A_pursuit') && !c.tac.att.used) {
      if (!eligible.length) { f.L.lines.push('Pursuit: no Defender ship is eligible to withdraw (every one failed Disengagement), so nothing withdraws and the card is not used.'); return G('withdraw'); }
      c.tac.att.used = true;
      f.L.lines.push('Pursuit! The Defender’s withdrawal is cancelled – a new Encounter follows between the same forces.');
      f.L.outcome = 'pursuit';
      return G('withdraw');
    }
    if (side === s.human) {
      if (!eligible.length) return G('withdraw');
      return P(choice('Withdrawal result against you', `${f.L.lines.join('\n')}\n\nThe result lets your Force Withdraw (optional for the human player). Withdraw to your Homeport's In Transit area (Coastal missions abort), or ignore the W and fight on at your own risk?`,
        [{ id: 'withdraw', label: 'Withdraw', primary: true }, { id: 'stay', label: 'Ignore – fight on' }], { combatView: true }), 'withdraw2');
    }
    f.answer = 'withdraw';
    f.L.wSide = side;
    return G('withdraw3');
  },
  withdraw2(s, f) {
    const c = cmb(s);
    if (f.answer === 'stay') { f.L.lines.push('You ignore the Withdrawal result.'); log(s, 'You ignore the Withdrawal result.', 'player'); return G('withdraw'); }
    f.L.wSide = s.human;
    return G('withdraw3');
  },
  withdraw3(s, f) {
    const side = f.L.wSide;
    const lines = doWithdrawal(s, side, f.L.failedDis[side] || [], (f.L.hit || {})[side] || []);
    f.L.lines = f.L.lines.concat(lines);
    return G('withdraw');
  },
  flagTransfer(s, f) {
    const c = cmb(s), h = s.human;
    // Human: optional flag transfer when the Flagship is Reduced
    const opt = flagTransferOptions(s, h);
    if (opt.length && !f.L.askedFlag) {
      f.L.askedFlag = true;
      return P(choice('Transfer the flag?', `${f.L.lines.join('\n')}\n\nYour Flagship ${shipName(s, s.flagship[h])} is Reduced. ${leaderName(s, h)} may try to shift his flag to an adjacent full-strength ship (he must pass a Leader Casualty Check).`,
        [{ id: 'stay', label: 'Stay aboard', primary: true }].concat(opt.map(id => ({ id, label: `Transfer to ${shipName(s, id)}` }))), { combatView: true }), 'flagTransfer2');
    }
    // AI: transfer automatically if it keeps the Command bonus for an attack
    const ai = s.ai, aopt = flagTransferOptions(s, ai);
    if (aopt.length && c.att === ai && commandDRMAvailable(s, ai)) { tryFlagTransfer(s, ai, aopt[0], f.L.lines); }
    logLines(s, f.L.lines.slice(1));
    return P(info('Gunnery Round results', f.L.lines.join('\n'), { combatView: true }), 'finishRound');
  },
  flagTransfer2(s, f) {
    if (f.answer !== 'stay') tryFlagTransfer(s, s.human, f.answer, f.L.lines);
    f.L.askedFlag = false;
    logLines(s, f.L.lines.slice(1));
    return P(info('Gunnery Round results', f.L.lines.join('\n'), { combatView: true }), 'finishRound');
  },
  finishRound(s, f) {
    const c = cmb(s), e = s.encounter;
    tidyColumns(s);
    if (c.sitting) { const sd = c.sitting.side; if (e.ships[c.sitting.id] === 'in') c.col[sd].push(c.sitting.id); c.sitting = null; }
    const oc = f.L.outcome; f.L.outcome = null;
    if (oc === 'pursuit') return R({ outcome: 'pursuit' });
    if (oc === 'segmentEnd') return R({ outcome: 'segmentEnd' });
    if (!encIds(s, 'US').length || !encIds(s, 'BR').length) return R({ outcome: 'encounterEnd' });
    if (!colShips(c, c.def).length) return R({ outcome: 'encounterEnd' });
    if (c.rainy) return R({ outcome: 'segmentEnd' });
    c.pos++;
    return G('next');
  },

  /* Weather Gage recheck ----------------------------------------------------------------- */
  wg(s, f) {
    const c = cmb(s), e = s.encounter, zf = zoneFlags(s);
    const prevStep = SEQ_STEPS[c.seq][c.pos - 1];
    if (prevStep === 'GR1' && tacActive(c, 'att', 'A_sweep')) { log(s, 'Sweep Up & Fire: skip the Weather Gage recheck.', 'combat'); c.pos++; return G('next'); }
    if (prevStep === 'GR2' && c.att === 'BR' && tacActive(c, 'att', 'A_grapple')) { log(s, 'Grapple: skip the Weather Gage recheck and go to Close Action.', 'combat'); c.pos++; c.grapple = true; return G('next'); }
    if (prevStep === 'GR2' && c.att === 'BR' && c.segment === 'patrol' && zf.breeze && !tacActive(c, 'att', 'A_sweep')) { log(s, 'Commanding Breeze: skip the Weather Gage recheck and go to Close Action.', 'event'); c.pos++; return G('next'); }
    let newWG, txt;
    if (tacActive(c, 'def', 'D_outmaneuver') && !c.tac.def.used) { c.tac.def.used = true; newWG = c.def; txt = `Defender Outmaneuver: the ${SIDE_PL[c.def]} automatically win the Weather Gage check.`; }
    else {
      const ev = drawEvent(s, 'Weather Gage recheck', false);
      newWG = ev.wg === 'A' ? 'US' : 'BR'; e.wgCard = ev.id;
      txt = `Weather Gage recheck: Event #${ev.id} → ${SIDE_NAME[newWG]}.`;
      f.L.ev = ev.id;
    }
    log(s, txt, 'event');
    e.wg = newWG;
    if (newWG === c.att) { c.pos++; return P(info('Weather Gage recheck', txt + `\nThe ${SIDE_PL[c.att]} keep the Weather Gage – continue Combat Sequence ${c.seq}.`, { eventCard: f.L.ev || null, combatView: true }), 'next'); }
    // Weather Gage changes: start the other Combat Sequence
    const newAtt = newWG;
    f.L.newAtt = newAtt;
    return P(info('Weather Gage changes!', txt + `\nCombat Sequence ${newAtt === 'US' ? 'A' : 'B'} begins.`, { eventCard: f.L.ev || null, combatView: true }), 'wgSwitch');
  },
  wgSwitch(s, f) {
    const newAtt = f.L.newAtt, e = s.encounter;
    if (newAtt === s.ai) {
